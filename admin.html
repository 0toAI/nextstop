<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextStop Master CMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #0b5fff; /* Blue */
            --accent: #a84a32; /* Terracotta */
            --bg-light: #f5f7fb; 
            --text-dark: #1a1a1a;
            --success: #27ae60;
            --danger: #e74c3c;
        }
        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { margin: 0; background: var(--bg-light); color: var(--text-dark); }
        
        /* HEADER & AUTH BAR */
        .header { background: var(--primary); color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .header h1 { font-family: 'Cinzel', serif; font-size: 1.5rem; margin: 0; }
        .auth-status { font-size: 0.85rem; }

        /* MAIN LAYOUT */
        .container { display: flex; min-height: calc(100vh - 70px); }

        /* LEFT: NAVIGATION */
        .nav-panel { width: 300px; background: white; border-right: 1px solid #ddd; overflow-y: auto; flex-shrink: 0; padding: 15px 0; }
        .nav-panel .btn-new { width: calc(100% - 20px); margin: 0 10px 15px; background: var(--success); font-weight: 600; padding: 10px; border-radius: 6px; }

        .region-group { margin-bottom: 5px; }
        .region-title { 
            padding: 10px 15px; font-weight: 800; cursor: pointer; font-size: 0.9rem; color: var(--text-dark); 
            display: flex; justify-content: space-between; align-items: center; background: #fff;
            border-bottom: 1px solid #eee; transition: background 0.2s;
        }
        .region-title:hover { background: #f0f0f0; }
        .toggle-arrow { transition: transform 0.3s; margin-left: 10px; color: var(--accent); }

        .sub-list { list-style: none; padding: 0; margin: 0; display: none; }
        .list-item { 
            padding: 8px 15px; border-bottom: 1px solid #f9f9f9; cursor: pointer; transition: background 0.1s; 
            border-left: 4px solid transparent; font-size: 0.85rem; margin-left: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .list-item:hover { background: #fafafa; }
        .list-item.active { background: #fff0eb; border-left-color: var(--accent); font-weight: 600; }
        
        .item-status { font-size: 0.7rem; font-weight: 600; padding: 3px 6px; border-radius: 3px; }
        .status-published { background: #e8f5e9; color: var(--green); }
        .status-hidden { background: #fbecec; color: var(--red); }

        /* CENTER: EDITOR & PREVIEW */
        .content-area { flex-grow: 1; padding: 20px; display: flex; gap: 20px; max-width: 1300px; margin: 0 auto; }
        .editor-form { flex: 2; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); height: fit-content; }
        .preview-pane { flex: 1; background: #f0f0f0; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); height: fit-content; position: sticky; top: 90px; }

        /* FORM ELEMENTS */
        h2 { font-family: 'Cinzel', serif; margin-top: 0; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; font-size: 1.3rem; }
        label { display: block; margin: 8px 0 4px; font-weight: 600; font-size: 13px; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; }
        .form-row { display: flex; gap: 20px; margin-bottom: 10px; }
        .form-col { flex: 1; }
        .action-bar { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }

        /* PREVIEW CARD STYLES */
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); height: 400px; position: relative; }
        .card-bg { width: 100%; height: 100%; object-fit: cover; }
        .card-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 30px; color: white; }
        .card h3 { font-family: 'Cinzel', serif; font-size: 1.3rem; margin: 0 0 8px 0; color: var(--gold); }
        .card-tag { position: absolute; top: 15px; right: 15px; background: var(--accent); color: white; padding: 4px 10px; border-radius: 4px; font-weight: 600; font-size: 0.7rem; }

        /* TOAST & IMPORT */
        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white; padding: 12px 20px; border-radius: 8px; z-index: 3000; }
        .btn-import { background: var(--blue); color: white; font-weight: 600; }
        
        /* LOGIN SCREEN */
        #loginCard { z-index: 2001; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1>NextStop Master CMS</h1>
        <div class="topbar">
            <span id="signedInEmail" class="auth-status">—</span>
            <button id="logoutBtn" style="background:var(--danger)">Logout</button>

    <!-- MAIN CONTAINER -->

        <!-- DASHBOARD (Hidden until authenticated) -->

            <!-- EDITOR AND PREVIEW -->
            <div class="content-area">
                
                <!-- LEFT: EDITOR -->

                    <div class="form-row">

                                <option value="tbilisi">Tbilisi</option>

                                <option value="imereti">Imereti</option>
                                <option value="samegrelo">Samegrelo</option>
                                <option value="guria">Guria</option>
                                <option value="racha">Racha</option>
                                <option value="svaneti">Svaneti</option>
                                <option value="adjara">Adjara</option>
                                <option value="abkhazeti">Abkhazeti</option>
                            </select>
                        </div>
                        <div class="form-col">
                            <label>Publish Status</label>
                            <select id="published">
                                <option value="true">Published (Live)</option>
                                <option value="false">Hidden (Draft)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <label>Title (English)</label>
                            <input type="text" id="title_en" oninput="updatePreview()">
                        </div>
                        <div class="form-col">
                            <label>Title (Georgian)</label>
                            <input type="text" id="title_ka">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <label id="lbl_desc_en">Short Description (English)</label>
                            <textarea id="desc_en" oninput="updatePreview()"></textarea>
                        </div>
                        <div class="form-col">
                            <label id="lbl_desc_ka">Short Description (Georgian)</label>
                            <textarea id="desc_ka"></textarea>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <label>Tag / Badge (English)</label>
                            <input type="text" id="tag_en" oninput="updatePreview()">
                        </div>
                        <div class="form-col">
                             <label>Tag / Badge (Georgian)</label>
                             <input type="text" id="tag_ka">
                        </div>
                    </div>

                    <label>Main Image URL / Upload</label>
                    <input type="text" id="img" oninput="updatePreview()" placeholder="Paste Unsplash URL or upload below">
                    <div class="uploader" style="margin-top:5px;">
                        <input type="file" id="imageFile" accept="image/*" style="width: auto;" />
                        <button id="uploadBtn" type="button" onclick="handleFileUpload()">Upload Image</button>
                        <div id="uploadProgress" class="muted"></div>
                    </div>
                    
                    <div id="blog-text-section" class="hidden">
                        <label style="margin-top:15px;">Full Article Text (English)</label>
                        <textarea id="text_en" style="min-height: 150px;"></textarea>
                        <label>Full Article Text (Georgian)</label>
                        <textarea id="text_ka" style="min-height: 150px;"></textarea>
                    </div>

                    <div class="action-bar">
                        <button id="deleteBtn" class="danger hidden">Delete Item</button>
                        <button id="saveBtn" class="btn-primary">Save New Item</button>
                    </div>
                </div>

                <!-- RIGHT: PREVIEW -->
                <div class="preview-pane">
                    <h3 class="preview-title">Live Card Preview</h3>
                    <div id="live-preview-container">
                        <div class="card">
                            <img src="https://via.placeholder.com/320x400?text=NextStop+Card" class="card-bg">
                            <div class="card-overlay">
                                <h3>Sample Title</h3>
                                <p>Sample Description</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <!-- FIREBASE MODULES -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>

    <script>
        // ============================
        // FIREBASE CONFIGURATION (Must be correct!)
        // ============================
        const firebaseConfig = {
            apiKey: "AIzaSyAM-24214oP5GTan935IE1fg6rn5BayUak",
            authDomain: "nextstop-e7017.firebaseapp.com",
            projectId: "nextstop-e7017",
            storageBucket: "nextstop-e7017.appspot.com",
            messagingSenderId: "530843130880",
            appId: "1:530843130880:web:53569b8204f7989e7e0ce5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // --- HARDCODED CONTENT FOR IMPORT (Restored) ---
        // This is the data that loads when you click the IMPORT button.
        const hardcodedDatabase = {
            tbilisi: { 
                accent: "#212F3C", 
                tours: [
                    { title: {en: "Old Town Walk", ka: "ძველი თბილისი"}, desc: {en: "History & Culture", ka: "ისტორია"}, img: "https://images.unsplash.com/photo-1580326733551-73e6c16f8517?auto=format&fit=crop&w=800&q=80", tag: {en: "History", ka: "ისტორია"} },
                    { title: {en: "Food Tour", ka: "გასტრო ტური"}, desc: {en: "Taste of Tbilisi", ka: "გემო"}, img: "https://images.unsplash.com/photo-1585671832383-10085d520131?auto=format&fit=crop&w=800&q=80", tag: {en: "Food", ka: "კვება"} },
                ], 
                blog: [
                     { title: {en: "Best Cafes", ka: "საუკეთესო კაფეები"}, date: {en: "Guide", ka: "გზამკვლევი"}, img: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=800&q=80" },
                     { title: {en: "Techno Scene", ka: "ტექნო სცენა"}, date: {en: "Nightlife", ka: "ღამე"}, img: "https://images.unsplash.com/photo-1598387993281-cecf8b71a8f8?auto=format&fit=crop&w=800&q=80" },
                ] 
            },
             // Placeholder data for other regions is omitted for brevity but should be in full structure.
        };
        const hardcodedServices = [
            { title: { en: "Travel Planning & Assistance", ka: "ტურების დაგეგმვა" }, desc: { en: "From wine and gastronomy tours to leisure and extreme adventure.", ka: "ჩვენ ვქმნით ავთენტურ გამოცდილებას." }, img: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=800&q=80" },
            { title: { en: "Transport & Security", ka: "ტრანსპორტი და დაცვა" }, desc: { en: "Move with confidence. We provide a complete fleet along with professional security.", ka: "იმოგზაურეთ თავდაჯერებულად." }, img: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=800&q=80" },
        ];


        // UI Elements and State Management
        const ui = {
            dashboard: document.getElementById('dashboard'),
            authCard: document.getElementById('authCard'),
            emailInput: document.getElementById('email'),
            passwordInput: document.getElementById('password'),
            signedInEmail: document.getElementById('signedInEmail'),
            logoutBtn: document.getElementById('logoutBtn'),
            entityTabs: document.getElementById('entityTabs'),
            listEl: document.getElementById('list'),
            editorTitle: document.getElementById('panelTitle'),
            saveBtn: document.getElementById('saveBtn'),
            updateBtn: document.getElementById('updateBtn'),
            resetBtn: document.getElementById('resetBtn'),
            formMessage: document.getElementById('formMessage'),
            uploadProgress: document.getElementById('uploadProgress')
        };

        let currentEntity = 'tours';
        let editingId = null;
        let uploadedImageUrl = null;
        let localDataCache = {}; // Cache for currently loaded list items

        // --------- UI Helpers ----------
        const showToast = (msg, isError = false) => {
            const toastEl = document.getElementById('toast');
            toastEl.textContent = msg;
            toastEl.style.backgroundColor = isError ? 'var(--danger)' : 'var(--success)';
            toastEl.classList.remove('hidden');
            setTimeout(() => toastEl.classList.add('hidden'), 3000);
        };
        const resetForm = () => {
            editingId = null;
            uploadedImageUrl = null;
            ui.editorTitle.textContent = `Add New ${capitalize(currentEntity)}`;
            document.getElementById('docId').value = '';
            document.getElementById('title_en').value = '';
            document.getElementById('description').value = '';
            document.getElementById('price').value = '';
            document.getElementById('category').value = '';
            document.getElementById('imageFile').value = '';
            document.getElementById('text_en').value = '';
            document.getElementById('text_ka').value = '';
            ui.saveBtn.classList.remove('hidden');
            ui.updateBtn.classList.add('hidden');
            ui.resetBtn.classList.add('hidden');
            ui.formMessage.textContent = '';
            ui.uploadProgress.textContent = '';
            // Update conditional fields (e.g., hiding full text for tours)
            toggleFields(currentEntity);
        };
        const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);
        
        const toggleFields = (entity) => {
             const isTour = entity === 'tours';
             const isBlog = entity === 'blog';

             // Show/hide fields based on the selected entity
             const priceEl = document.getElementById('price').parentElement;
             if (priceEl) priceEl.style.display = isTour ? '' : 'none';

             const blogTextEl = document.getElementById('blog-text-section');
             if (blogTextEl) blogTextEl.classList.toggle('hidden', !isBlog);

             // Update labels dynamically (not implemented here but good practice)
        };
        // End of UI Helpers

        // --------- Auth & Core Setup ----------
        auth.onAuthStateChanged(async user => {
            if (!user) {
                ui.authCard.classList.remove('hidden');
                ui.dashboard.classList.add('hidden');
                ui.signedInEmail.textContent = '—';
                return;
            }
            ui.signedInEmail.textContent = user.email;
            
            // Check if user is authorized admin (security layer)
            const adminDoc = await db.collection('admins').where('email', '==', user.email).limit(1).get();
            if (adminDoc.empty) {
                 ui.authMessage.textContent = 'Access Denied: Your email is not whitelisted.';
                 auth.signOut();
                 return;
            }

            // User authorized
            ui.authCard.classList.add('hidden');
            ui.dashboard.classList.remove('hidden');
            
            // Initial Dashboard setup
            setupDashboard();
            loadList(true);
        });

        const setupDashboard = () => {
            // Tab switching logic
            Array.from(ui.entityTabs.querySelectorAll('.tab')).forEach(t => {
                t.onclick = () => {
                    Array.from(ui.entityTabs.querySelectorAll('.tab')).forEach(x => x.classList.remove('active'));
                    t.classList.add('active');
                    currentEntity = t.dataset.entity;
                    switchEntity(currentEntity);
                };
            });
            ui.saveBtn.onclick = handleCreate;
            ui.updateBtn.onclick = handleUpdate;
            ui.resetBtn.onclick = resetForm;
            ui.logoutBtn.onclick = () => auth.signOut();
            document.getElementById('deleteBtn').onclick = handleDelete;
            document.getElementById('refreshBtn').onclick = () => loadList(true);
            document.getElementById('loginBtn').onclick = handleLogin;
        };

        const handleLogin = async () => {
             ui.authMessage.textContent = '';
             try {
                await auth.signInWithEmailAndPassword(ui.emailInput.value.trim(), ui.passwordInput.value);
             } catch (e) {
                ui.authMessage.textContent = 'Error: ' + e.message;
             }
        };

        const switchEntity = (entity) => {
            currentEntity = entity;
            ui.editorTitle.textContent = `Manage ${capitalize(entity)}`;
            resetForm();
            loadList(true);
            toggleFields(entity);
        };
        // End of Auth & Core Setup

        // --------- Image Upload ----------
        window.handleFileUpload = async () => {
            const f = document.getElementById('imageFile').files[0];
            if (!f) { ui.uploadProgress.textContent = 'Choose a file first'; return; }
            const path = `${currentEntity}/${Date.now()}_${f.name}`;
            const ref = storage.ref().child(path);
            const task = ref.put(f);
            ui.uploadProgress.textContent = 'Uploading... 0%';
            task.on('state_changed',
                snapshot => {
                    const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                    ui.uploadProgress.textContent = 'Uploading... ' + pct + '%';
                },
                err => {
                    ui.uploadProgress.textContent = 'Upload error: ' + err.message;
                },
                async () => {
                    const url = await task.snapshot.ref.getDownloadURL();
                    uploadedImageUrl = url;
                    ui.uploadProgress.textContent = 'Uploaded ✓';
                    document.getElementById('formMessage').textContent = 'Image uploaded and attached.';
                }
            );
        };
        // End of Image Upload

        // --------- CRUD: Data Manipulation ----------
        const gatherFormData = () => {
             const data = {
                title: document.getElementById('title').value.trim(),
                description: document.getElementById('description').value.trim(),
                price: document.getElementById('price').value.trim() || null,
                category: document.getElementById('category').value.trim() || null,
                images: uploadedImageUrl ? [uploadedImageUrl] : []
             };
             // Add language and published status (using the selects/checkboxes)
             data.published = document.getElementById('published').value === 'true';
             // You would need separate fields for EN/KA, but adapting to this structure:
             // For demonstration, let's keep it simple for this template
             
             return data;
        };
        
        async function handleCreate(){
            ui.formMessage.textContent = '';
            const data = gatherFormData();
            if (!data.title) { ui.formMessage.textContent = 'Title required'; return; }

            try {
                data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                const docRef = await db.collection(currentEntity).add(data);
                showToast('Created successfully!');
                resetForm();
                loadList(true);
            } catch (e) {
                showToast('Error: ' + e.message, true);
            }
        }

        async function handleUpdate(){
            if (!editingId) return;
            const data = gatherFormData();
            try {
                data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
                await db.collection(currentEntity).doc(editingId).update(data);
                showToast('Updated successfully!');
                resetForm();
                loadList(true);
            } catch (e) {
                showToast('Error: ' + e.message, true);
            }
        }
        
        async function handleDelete(){
            if (!editingId) return;
            if (!confirm('Are you sure you want to delete this item?')) return;
            try {
                await db.collection(currentEntity).doc(editingId).delete();
                showToast('Deleted successfully!');
                resetForm();
                loadList(true);
            } catch (e) {
                showToast('Error: ' + e.message, true);
            }
        }

        const startEdit = (id, data) => {
            editingId = id;
            ui.editorTitle.textContent = `Editing ${capitalize(currentEntity)}: ${data.title || id}`;
            
            // Fill inputs with retrieved data
            document.getElementById('title').value = data.title || '';
            document.getElementById('description').value = data.description || '';
            document.getElementById('price').value = data.price || '';
            document.getElementById('category').value = data.category || '';
            document.getElementById('published').value = data.published ? 'true' : 'false';

            uploadedImageUrl = (data.images && data.images[0]) || null;
            ui.uploadProgress.textContent = uploadedImageUrl ? 'Image attached' : '';
            
            ui.saveBtn.classList.add('hidden');
            ui.updateBtn.classList.remove('hidden');
            document.getElementById('deleteBtn').classList.remove('hidden');
            ui.resetBtn.classList.remove('hidden');
        };

        // --------- List Loading (Refreshed) ---------
        async function loadList(forceReload=false){
            listEl.innerHTML = '<div class="muted" style="text-align:center;">Loading...</div>';
            try {
                let q = db.collection(currentEntity).orderBy('createdAt','desc').limit(100);
                const snap = await q.get();
                lastSnapshot = snap;
                renderList(snap.docs);
            } catch (e) {
                listEl.innerHTML = '<div class="muted" style="color:var(--danger)">Error loading list: '+e.message+'</div>';
            }
        }

        function renderList(docs){
            if (!docs.length) { listEl.innerHTML = '<div class="muted" style="text-align:center;">No items added yet.</div>'; return; }
            listEl.innerHTML = '';
            docs.forEach(doc=>{
                const d = doc.data();
                const item = document.createElement('div');
                item.className = 'item';
        
                // Store data on the element for easy access in edit function
                item.dataset.id = doc.id;
                
                const left = document.createElement('div');
                left.innerHTML = '<div style="font-weight:600;">'+escapeHtml(d.title || '(no title)')+'</div><div class="small muted">'+escapeHtml(d.description ? (d.description.substring(0,60) + (d.description.length > 60 ? '...' : '')) : '')+'</div>';
                
                const right = document.createElement('div');
                right.className = 'flex actions';
                
                // EDIT Button
                const editBtn = document.createElement('button'); editBtn.textContent = 'Edit';
                editBtn.onclick = ()=> startEdit(doc.id, d); 
                
                // DELETE Button
                const delBtn = document.createElement('button'); delBtn.textContent = 'Delete'; delBtn.classList.add('danger');
                delBtn.onclick = ()=> confirmDelete(doc.id);
                
                right.appendChild(editBtn);
                right.appendChild(delBtn);
                item.appendChild(left);
                item.appendChild(right);
                listEl.appendChild(item);
            });
        }


    // --------- utilities ----------
    function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"'`=\/]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'}[c]; }); }
  </script>
</body>
