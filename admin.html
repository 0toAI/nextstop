<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextStop Master Control - CMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom Styles for CMS Layout */
        body { background-color: #f8f9fa; }
        #cms-layout { display: none; } /* Hidden until authenticated */
        #sidebar { min-width: 280px; max-width: 280px; height: 100vh; background: #343a40; color: #fff; position: sticky; top: 0; padding-top: 20px; }
        #sidebar a { color: #ced4da; padding: 10px 15px; display: block; text-decoration: none; }
        #sidebar a:hover { background: #495057; color: #fff; }
        .list-group-item { background-color: #343a40; border: none; padding: 0; }
        .editor-container { padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        .nav-link.active-item { font-weight: bold; background-color: #0d6efd !important; color: white !important; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="login-container" class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="card p-4" style="width: 400px;">
            <h2 class="card-title text-center">NextStop Login</h2>
            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Log In</button>
                <div id="login-error" class="text-danger mt-3" style="display: none;"></div>
            </form>
        </div>
    </div>

    <div id="cms-layout" class="d-flex">
        
        <div id="sidebar" class="d-flex flex-column">
            <h4 class="text-center mb-4 text-warning">Master Control</h4>
            <div class="flex-grow-1 overflow-auto">
                <ul class="list-group list-group-flush" id="navigation-tree">
                    <li class="list-group-item"><a href="#" class="nav-link text-white" onclick="loadContentList('Tours')">Tours</a>
                        <ul class="list-group list-group-flush ms-3" id="Tours-regions"></ul>
                    </li>
                    <li class="list-group-item"><a href="#" class="nav-link text-white" onclick="loadContentList('Services')">Services</a>
                        <ul class="list-group list-group-flush ms-3" id="Services-regions"></ul>
                    </li>
                    <li class="list-group-item"><a href="#" class="nav-link text-white" onclick="loadContentList('Journal Posts')">Journal Posts</a>
                        <ul class="list-group list-group-flush ms-3" id="Journal Posts-regions"></ul>
                    </li>
                </ul>
            </div>
            <button class="btn btn-sm btn-outline-light m-3" onclick="logout()">Logout</button>
        </div>

        <div id="editor-panel" class="flex-grow-1 p-4">
            <h1 class="mb-4" id="editor-title">Welcome to NextStop Master Control</h1>
            
            <div id="editor-content" class="editor-container">
                <p>Select an item from the left panel to edit, or click a primary group (Tours, Services, Journal Posts) to create a new one.</p>
                </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <script>
        // === D. Data Source (Firebase Config) ===
        const firebaseConfig = {
            apiKey: "AIzaSyAM-24214oP5GTan935IE1fg6rn5BayUak",
            authDomain: "nextstop-e7017.firebaseapp.com",
            projectId: "nextstop-e7017",
            storageBucket: "nextstop-e7017.firebasestorage.app",
            messagingSenderId: "530843130880",
            appId: "1:530843130880:web:53569b8204f7989e7e0ce5",
            measurementId: "G-JLM2Z6XSWB"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
        const storage = app.storage();

        // Global State for Editor
        let currentEditingItem = null;
        let currentItemType = null; // e.g., 'Tours', 'Services', 'Journal Posts'

        // Utility to map display name to Firestore collection name
        const collectionMap = {
            'Tours': 'tours',
            'Services': 'services',
            'Journal Posts': 'journal_posts'
        };

        // ===================================
        // === 1. AUTHENTICATION FUNCTIONS ===
        // ===================================

        // Check authentication state on load
        auth.onAuthStateChanged(user => {
            const loginContainer = document.getElementById('login-container');
            const cmsLayout = document.getElementById('cms-layout');

            if (user) {
                // User is signed in, show CMS
                loginContainer.style.display = 'none';
                cmsLayout.style.display = 'flex';
                loadAllNavigationData(); // Load navigation data upon successful login
            } else {
                // User is signed out, show login
                loginContainer.style.display = 'flex';
                cmsLayout.style.display = 'none';
            }
        });

        // Handle Login Form Submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');

            try {
                await auth.signInWithEmailAndPassword(email, password);
                errorDiv.style.display = 'none';
            } catch (error) {
                errorDiv.textContent = `Login failed: ${error.message}`;
                errorDiv.style.display = 'block';
            }
        });

        // Logout function
        function logout() {
            auth.signOut();
        }

        // ===================================
        // === 2. NAVIGATION (LEFT PANEL) ===
        // ===================================

        // Loads all content lists and sets up real-time listeners (CRITICAL FIX)
        function loadAllNavigationData() {
            Object.keys(collectionMap).forEach(displayName => {
                const collectionName = collectionMap[displayName];
                const regionListId = `${displayName}-regions`;
                const regionListElement = document.getElementById(regionListId);
                
                // Real-time listener for the navigation tree
                db.collection(collectionName).onSnapshot(snapshot => {
                    regionListElement.innerHTML = ''; // Clear existing list

                    const items = snapshot.docs.map(doc => ({ 
                        id: doc.id, 
                        ...doc.data() 
                    }));

                    // Secondary Grouping: Grouped by Region
                    const groupedByRegion = items.reduce((acc, item) => {
                        const region = item.region || 'Uncategorized'; // Assume a 'region' field exists
                        if (!acc[region]) {
                            acc[region] = [];
                        }
                        acc[region].push(item);
                        return acc;
                    }, {});

                    // Render the tree view
                    for (const region in groupedByRegion) {
                        const regionLi = document.createElement('li');
                        regionLi.classList.add('list-group-item');
                        regionLi.innerHTML = `<a href="#" class="nav-link text-white small">${region} (${groupedByRegion[region].length})</a>`;
                        
                        const itemUl = document.createElement('ul');
                        itemUl.classList.add('list-group', 'list-group-flush', 'ms-3');

                        // Item Listing: Individual item titles
                        groupedByRegion[region].forEach(item => {
                            const itemLi = document.createElement('li');
                            itemLi.classList.add('list-group-item', 'ps-0');
                            const title = item.title ? (item.title.en || 'No English Title') : 'Untitled Item';
                            
                            // Load data into central editor on click (CRITICAL FIX: relies on setting state)
                            itemLi.innerHTML = `<a href="#" class="nav-link text-white-50" 
                                onclick="loadEditor('${item.id}', '${displayName}', event)">
                                ${title}
                            </a>`;
                            itemUl.appendChild(itemLi);
                        });

                        regionLi.appendChild(itemUl);
                        regionListElement.appendChild(regionLi);
                    }
                }, error => {
                    console.error("Error loading navigation data for", collectionName, error);
                });
            });
        }

        // ===================================
        // === 3. CONTENT EDITOR (CENTER) ===
        // ===================================

        // Template for the Content Editor Form
        function generateEditorForm(item = null, type) {
            const isNew = !item;
            const itemData = item || {
                title: { en: '', ka: '' },
                description: { en: '', ka: '' },
                tag: { en: '', ka: '' },
                isPublished: false,
                itinerary: []
            };

            currentItemType = type;

            document.getElementById('editor-title').textContent = isNew ? `Create New ${type.slice(0, -1)}` : `Edit: ${itemData.title.en || 'Untitled'}`;

            // Main Editor HTML Structure
            let html = `
                <form id="content-editor-form">
                    <input type="hidden" id="docId" value="${item ? item.id : ''}">
                    
                    <h3 class="mb-3">General Information</h3>

                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="isPublished" ${itemData.isPublished ? 'checked' : ''}>
                        <label class="form-check-label" for="isPublished">
                            Status: <span class="fw-bold text-${itemData.isPublished ? 'success' : 'danger'}">${itemData.isPublished ? 'LIVE' : 'DRAFT'}</span>
                        </label>
                    </div>

                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">Title (EN)</label>
                            <input type="text" class="form-control" id="title-en" value="${itemData.title.en || ''}" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Title (KA)</label>
                            <input type="text" class="form-control" id="title-ka" value="${itemData.title.ka || ''}" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">Description (EN)</label>
                            <textarea class="form-control" id="description-en" rows="3">${itemData.description.en || ''}</textarea>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Description (KA)</label>
                            <textarea class="form-control" id="description-ka" rows="3">${itemData.description.ka || ''}</textarea>
                        </div>
                    </div>
                    <div class="row mb-4">
                        <div class="col-6">
                            <label class="form-label">Tag/Category (EN)</label>
                            <input type="text" class="form-control" id="tag-en" value="${itemData.tag.en || ''}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Tag/Category (KA)</label>
                            <input type="text" class="form-control" id="tag-ka" value="${itemData.tag.ka || ''}">
                        </div>
                    </div>
                    
                    <hr>

                    <h3 class="mb-3">Media Management</h3>
                    <div class="mb-4">
                        <label class="form-label">Image URL (External/Pasted)</label>
                        <input type="url" class="form-control mb-2" id="imageUrl" value="${itemData.imageUrl || ''}" placeholder="Paste Unsplash or external URL here">
                        
                        <label class="form-label">OR Upload Local File (to Firebase Storage)</label>
                        <input type="file" class="form-control" id="imageUploader" accept="image/*">
                        <div class="progress mt-2" style="height: 20px; display: none;" id="uploadProgressContainer">
                            <div class="progress-bar" role="progressbar" id="uploadProgressBar" style="width: 0%;">0%</div>
                        </div>
                        <div id="currentImagePreview" class="mt-2">
                            ${itemData.imageUrl ? `<img src="${itemData.imageUrl}" class="img-thumbnail" style="max-height: 150px;">` : 'No Image Set'}
                        </div>
                    </div>

                    <hr>
                    
                    <h3 class="mb-3">Sub-Content: Itinerary/Details</h3>
                    <div id="itinerary-steps-container" class="mb-4">
                        </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary mb-4" onclick="addItineraryStep()">+ Add Step</button>

                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-success btn-lg">${isNew ? 'Create Item' : 'Update Item'}</button>
                        ${!isNew ? `<button type="button" class="btn btn-danger btn-lg" onclick="deleteItem('${item.id}', '${type}')">Delete Item</button>` : ''}
                    </div>
                    <div id="editor-status" class="mt-3"></div>
                </form>
            `;

            document.getElementById('editor-content').innerHTML = html;
            
            // Attach event listener for image upload
            document.getElementById('imageUploader').addEventListener('change', uploadImage);
            
            // Populate Itinerary Steps
            itemData.itinerary.forEach((step, index) => addItineraryStep(step, index));
            if (itemData.itinerary.length === 0) {
                // Ensure at least one blank row for new/empty items
                addItineraryStep(); 
            }
            
            // Attach submit listener to the new form
            document.getElementById('content-editor-form').addEventListener('submit', handleSaveForm);
        }

        // Loads a document into the editor
        async function loadEditor(docId, type, event) {
            if (event) event.preventDefault();
            currentEditingItem = docId;
            currentItemType = type;
            const collectionName = collectionMap[type];

            // Highlight the selected item in the sidebar
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active-item'));
            if (event && event.target) {
                 event.target.classList.add('active-item');
            }
            
            try {
                const docRef = db.collection(collectionName).doc(docId);
                const docSnap = await docRef.get();

                if (docSnap.exists) {
                    const item = { id: docSnap.id, ...docSnap.data() };
                    generateEditorForm(item, type);
                } else {
                    alert('Error: Document not found.');
                }
            } catch (error) {
                console.error("Error loading document:", error);
                alert('Failed to load document. Check console for details.');
            }
        }
        
        function loadContentList(type) {
            // Function to reset the editor for creating a new item
            currentEditingItem = null;
            currentItemType = type;
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active-item'));
            generateEditorForm(null, type);
        }


        // Dynamic Itinerary Management
        function addItineraryStep(step = { title: '', description: '' }, index = Date.now()) {
            const container = document.getElementById('itinerary-steps-container');
            const stepDiv = document.createElement('div');
            stepDiv.classList.add('p-3', 'mb-3', 'border', 'rounded', 'bg-light', 'itinerary-step');
            stepDiv.setAttribute('data-index', index);
            
            stepDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0">Step ${container.children.length + 1}</h5>
                    <button type="button" class="btn-close" aria-label="Close" onclick="this.closest('.itinerary-step').remove()"></button>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Title</label>
                    <input type="text" class="form-control" name="itinerary-title" value="${step.title}">
                </div>
                <div class="mb-0">
                    <label class="form-label small">Description</label>
                    <textarea class="form-control" name="itinerary-description" rows="2">${step.description}</textarea>
                </div>
            `;
            container.appendChild(stepDiv);
        }
        
        // ===================================
        // === 4. CRUD OPERATIONS & SYNC ===
        // ===================================

        // Media Management: Upload image to Firebase Storage
        async function uploadImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            const progressContainer = document.getElementById('uploadProgressContainer');
            const progressBar = document.getElementById('uploadProgressBar');
            const statusDiv = document.getElementById('editor-status');
            const imageUrlInput = document.getElementById('imageUrl');
            
            progressContainer.style.display = 'flex';
            statusDiv.innerHTML = 'Uploading...';

            try {
                // C. Upload file to Firebase Storage
                const storageRef = storage.ref(`${collectionMap[currentItemType]}/${file.name}`);
                const uploadTask = storageRef.put(file);

                // Progress Bar
                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        progressBar.style.width = progress + '%';
                        progressBar.textContent = `${Math.round(progress)}%`;
                    }, 
                    (error) => {
                        console.error('Upload failed:', error);
                        statusDiv.innerHTML = `<div class="text-danger">Upload Failed: ${error.message}</div>`;
                        progressContainer.style.display = 'none';
                    }, 
                    async () => {
                        // Get the public download URL
                        const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
                        
                        // Update the form field and preview
                        imageUrlInput.value = downloadURL;
                        document.getElementById('currentImagePreview').innerHTML = `<img src="${downloadURL}" class="img-thumbnail" style="max-height: 150px;">`;
                        
                        statusDiv.innerHTML = `<div class="text-success">Upload Complete! URL saved to field.</div>`;
                        progressContainer.style.display = 'none';
                    }
                );
            } catch (error) {
                console.error("File upload error:", error);
                statusDiv.innerHTML = `<div class="text-danger">A system error occurred during upload.</div>`;
            }
        }

        // Data Synchronization: Handle Save/Update
        async function handleSaveForm(e) {
            e.preventDefault();
            const form = e.target;
            const docId = form.elements.docId.value;
            const collectionName = collectionMap[currentItemType];
            const statusDiv = document.getElementById('editor-status');
            statusDiv.innerHTML = 'Saving...';

            // Gather Itinerary Data
            const itinerarySteps = [];
            document.querySelectorAll('.itinerary-step').forEach(stepDiv => {
                const titleInput = stepDiv.querySelector('input[name="itinerary-title"]').value;
                const descTextarea = stepDiv.querySelector('textarea[name="itinerary-description"]').value;
                if (titleInput || descTextarea) {
                    itinerarySteps.push({
                        title: titleInput,
                        description: descTextarea
                    });
                }
            });

            // Construct the final data object
            const docData = {
                // Required Fields (Multi-Language)
                title: { 
                    en: form.elements['title-en'].value, 
                    ka: form.elements['title-ka'].value 
                },
                description: { 
                    en: form.elements['description-en'].value, 
                    ka: form.elements['description-ka'].value 
                },
                tag: { 
                    en: form.elements['tag-en'].value, 
                    ka: form.elements['tag-ka'].value 
                },
                // Status Toggle
                isPublished: form.elements.isPublished.checked,
                // Media Management
                imageUrl: form.elements.imageUrl.value,
                // Sub-Content
                itinerary: itinerarySteps,
                // Metadata
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (docId) {
                    // Update: Data Synchronization (Update)
                    await db.collection(collectionName).doc(docId).update(docData);
                    statusDiv.innerHTML = `<div class="text-success">Item updated successfully!</div>`;
                } else {
                    // Create: Data Synchronization (Create)
                    const newDocRef = await db.collection(collectionName).add({
                        ...docData,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Update form with new ID for subsequent edits
                    form.elements.docId.value = newDocRef.id;
                    currentEditingItem = newDocRef.id;
                    
                    statusDiv.innerHTML = `<div class="text-success">New item created successfully!</div>`;
                }
            } catch (error) {
                console.error("Save failed:", error);
                statusDiv.innerHTML = `<div class="text-danger">Save Failed: ${error.message}</div>`;
            }
        }
        
        // Data Synchronization: Delete
        async function deleteItem(docId, type) {
            if (!confirm(`Are you sure you want to permanently delete this ${type.slice(0, -1)}? This cannot be undone.`)) {
                return;
            }

            const collectionName = collectionMap[type];
            const statusDiv = document.getElementById('editor-status');
            
            try {
                // First, attempt to delete any linked image in Storage (optional, but good practice)
                const imageUrl = document.getElementById('imageUrl').value;
                if (imageUrl && imageUrl.includes(firebaseConfig.storageBucket)) {
                    // Only attempt deletion if it's a Firebase Storage URL
                    const storagePath = imageUrl.split('?')[0].split('%2F').slice(-2).join('/');
                    await storage.ref(storagePath).delete().catch(e => console.warn('Could not delete storage file, may not exist or permissions issue:', e));
                }
                
                // Then, delete the Firestore document
                await db.collection(collectionName).doc(docId).delete();
                
                alert('Item deleted successfully.');
                // Reset the view after deletion
                document.getElementById('editor-content').innerHTML = '<p>Item deleted. Select a new item or group from the left panel.</p>';
                document.getElementById('editor-title').textContent = 'Welcome to NextStop Master Control';
                currentEditingItem = null;
                currentItemType = null;

            } catch (error) {
                console.error("Delete failed:", error);
                statusDiv.innerHTML = `<div class="text-danger">Delete Failed: ${error.message}</div>`;
            }
        }

    </script>

    <div id="loading-message" class="text-center mt-5">Loading Admin Panel...</div>
    <script>
        // Hide loading message once the app structure is ready
        document.getElementById('loading-message').style.display = 'none';
    </script>
</body>
</html>
