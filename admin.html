<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | NextStop</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --charcoal: #1a1a1a; --terracotta: #a84a32; --gray-light: #f4f4f4; --green: #27ae60; --red: #c0392b; }
        * { box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background: var(--gray-light); color: var(--charcoal); margin: 0; padding: 0; min-height: 100vh; }
        
        /* LOGIN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--charcoal); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 350px; text-align: center; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .login-btn { background: var(--terracotta); color: white; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; }

        /* LAYOUT */
        .admin-header { background: white; padding: 15px 40px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .admin-title { font-family: 'Cinzel', serif; margin: 0; font-size: 1.5rem; color: var(--charcoal); }
        .admin-wrapper { display: flex; height: calc(100vh - 70px); }

        /* LEFT: LIST */
        .list-panel { width: 350px; background: white; border-right: 1px solid #ddd; overflow-y: auto; padding: 20px; }
        .list-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
        .list-item:hover { background: #f9f9f9; }
        .list-item.active { background: #fff5f2; border-left-color: var(--terracotta); }
        .item-status { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; float: right; }
        .status-published { color: var(--green); }
        .status-hidden { color: var(--red); }
        .item-title { font-weight: bold; display: block; margin-bottom: 5px; }
        .item-meta { font-size: 0.8rem; color: #888; }

        /* RIGHT: EDITOR */
        .editor-panel { flex: 1; padding: 40px; overflow-y: auto; }
        .editor-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); max-width: 900px; margin: 0 auto; }
        
        /* FORM ELEMENTS */
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; }
        .form-col { flex: 1; }
        label { display: block; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #999; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem; }
        textarea { resize: vertical; min-height: 80px; }
        
        .toggle-wrapper { display: flex; align-items: center; gap: 10px; background: #f0f0f0; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
        .toggle-switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--green); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* SUB-ITEMS (Dynamic List) */
        .sub-items-container { border: 1px solid #eee; padding: 15px; border-radius: 4px; margin-bottom: 20px; background: #fafafa; }
        .sub-item-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; background: white; padding: 10px; border: 1px solid #eee; }
        .remove-btn { background: #ffcdd2; color: #c62828; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .add-btn { background: var(--charcoal); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }

        /* ACTION BAR */
        .action-bar { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn-primary { background: var(--terracotta); color: white; border: none; padding: 12px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-danger { background: white; color: var(--red); border: 1px solid var(--red); padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-new { background: var(--green); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        
        .status-toast { position: fixed; bottom: 20px; right: 20px; background: var(--charcoal); color: white; padding: 15px 25px; border-radius: 4px; display: none; animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translateY(100px); } to { transform: translateY(0); } }
        
        .import-btn { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: auto; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>NextStop Manager</h2>
            <input type="email" id="login-email" class="login-input" placeholder="Email">
            <input type="password" id="login-pass" class="login-input" placeholder="Password">
            <button class="login-btn" onclick="handleLogin()">SECURE LOGIN</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="admin-header" style="display:none;" id="main-header">
        <h1 class="admin-title">Control Panel</h1>
        <div style="display:flex; gap:10px;">
            <button class="import-btn" onclick="importHardcodedData()">⚠ IMPORT WEBSITE DATA</button>
            <button onclick="handleLogout()" style="background:none; border:none; cursor:pointer; text-decoration:underline;">Logout</button>
        </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="admin-wrapper" style="display:none;" id="main-wrapper">
        
        <!-- LEFT: LIST -->
        <div class="list-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="margin:0;">All Content</h3>
                <button class="btn-new" onclick="createNew()">+ NEW</button>
            </div>
            <div id="items-list">
                <!-- JS Populates This -->
            </div>
        </div>

        <!-- RIGHT: EDITOR -->
        <div class="editor-panel">
            <div class="editor-card">
                <input type="hidden" id="docId">
                
                <!-- PUBLISH TOGGLE -->
                <div class="toggle-wrapper">
                    <label class="toggle-switch">
                        <input type="checkbox" id="published" checked>
                        <span class="slider"></span>
                    </label>
                    <span style="font-weight:bold; font-size:0.9rem;">PUBLISHED (Visible on Website)</span>
                </div>

                <!-- MAIN DETAILS -->
                <div class="form-row">
                    <div class="form-col">
                        <label>Region / Category</label>
                        <select id="region">
                            <option value="georgia">Home (Sakartvelo)</option>
                            <option value="tbilisi">Tbilisi</option>
                            <option value="kakheti">Kakheti</option>
                            <option value="kazbegi">Kazbegi</option>
                            <option value="svaneti">Svaneti</option>
                            <option value="adjara">Adjara</option>
                            <option value="abkhazeti">Abkhazeti</option>
                            <option value="imereti">Imereti</option>
                            <option value="samegrelo">Samegrelo</option>
                            <option value="guria">Guria</option>
                            <option value="racha">Racha</option>
                            <option value="kartli">Kartli</option>
                            <option value="mtskheta_mtianeti">Mtskheta-Mtianeti</option>
                            <option value="samtskhe_javakheti">Samtskhe-Javakheti</option>
                        </select>
                    </div>
                    <div class="form-col">
                        <label>Content Type</label>
                        <select id="type" onchange="toggleFields()">
                            <option value="tours">Tour Package</option>
                            <option value="blog">Journal Post</option>
                            <option value="services">Service</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <label>Title (English)</label>
                        <input type="text" id="title_en">
                    </div>
                    <div class="form-col">
                        <label>Title (Georgian)</label>
                        <input type="text" id="title_ka">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <label id="lbl_desc_en">Description (English)</label>
                        <textarea id="desc_en"></textarea>
                    </div>
                    <div class="form-col">
                        <label id="lbl_desc_ka">Description (Georgian)</label>
                        <textarea id="desc_ka"></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <label>Main Image URL</label>
                        <input type="text" id="img">
                    </div>
                    <div class="form-col">
                        <label>Tag / Badge (EN/KA)</label>
                        <div style="display:flex; gap:5px;">
                            <input type="text" id="tag_en" placeholder="EN">
                            <input type="text" id="tag_ka" placeholder="KA">
                        </div>
                    </div>
                </div>

                <!-- DYNAMIC SUB-ITEMS (ITINERARY) -->
                <div id="subitems-section" class="sub-items-container">
                    <label style="margin-bottom:10px; display:block; color:#333;">ITINERARY / DETAILS</label>
                    <div id="subitems-list"></div>
                    <button type="button" class="add-btn" onclick="addSubItem()">+ Add Row</button>
                </div>

                <!-- BLOG TEXT AREA (Only for Blog) -->
                <div id="blog-section" style="display:none;">
                    <label>Full Article Text (English)</label>
                    <textarea id="text_en" style="height:150px; margin-bottom:10px;"></textarea>
                    <label>Full Article Text (Georgian)</label>
                    <textarea id="text_ka" style="height:150px;"></textarea>
                </div>

                <div class="action-bar">
                    <button class="btn-danger" onclick="deleteCurrent()">Delete Item</button>
                    <button class="btn-primary" onclick="saveCurrent()">SAVE CHANGES</button>
                </div>

            </div>
        </div>
    </div>

    <div id="toast" class="status-toast">Saved Successfully</div>

    <!-- FIREBASE CONFIG -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- 🔴 PASTE YOUR FIREBASE CONFIG HERE 🔴 ---
        const firebaseConfig = {
            apiKey: "AIzaSyAM-24214oP5GTan935IE1fg6rn5BayUak",
            authDomain: "nextstop-e7017.firebaseapp.com",
            projectId: "nextstop-e7017",
            storageBucket: "nextstop-e7017.firebasestorage.app",
            messagingSenderId: "530843130880",
            appId: "1:530843130880:web:53569b8204f7989e7e0ce5",
            measurementId: "G-JLM2Z6XSWB"
        };
        // ------------------------------------------------

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- GLOBAL VARS ---
        let contentData = [];
        let currentId = null;

        // --- AUTH ---
        window.handleLogin = () => {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert(err.message));
        };
        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            if(user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-header').style.display = 'flex';
                document.getElementById('main-wrapper').style.display = 'flex';
                loadData();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('main-header').style.display = 'none';
                document.getElementById('main-wrapper').style.display = 'none';
            }
        });

        // --- DATA LOADING ---
        async function loadData() {
            const list = document.getElementById('items-list');
            list.innerHTML = 'Loading...';
            contentData = [];
            
            const q = query(collection(db, "content")); // Add orderBy later
            const snap = await getDocs(q);
            
            list.innerHTML = '';
            snap.forEach(doc => {
                const d = doc.data();
                d.id = doc.id;
                contentData.push(d);
                
                const div = document.createElement('div');
                div.className = `list-item ${d.published ? '' : 'inactive'}`;
                div.onclick = () => selectItem(d);
                div.innerHTML = `
                    <span class="item-status ${d.published ? 'status-published' : 'status-hidden'}">
                        ${d.published ? 'LIVE' : 'HIDDEN'}
                    </span>
                    <span class="item-title">${d.title?.en || 'Untitled'}</span>
                    <div class="item-meta">${d.region.toUpperCase()} • ${d.type.toUpperCase()}</div>
                `;
                list.appendChild(div);
            });
        }

        // --- EDITOR LOGIC ---
        window.selectItem = (data) => {
            currentId = data.id;
            document.getElementById('docId').value = data.id;
            document.getElementById('published').checked = data.published;
            
            document.getElementById('region').value = data.region;
            document.getElementById('type').value = data.type;
            
            document.getElementById('title_en').value = data.title?.en || '';
            document.getElementById('title_ka').value = data.title?.ka || '';
            
            // Smart field mapping
            const descEn = data.desc?.en || data.date?.en || '';
            const descKa = data.desc?.ka || data.date?.ka || '';
            document.getElementById('desc_en').value = descEn;
            document.getElementById('desc_ka').value = descKa;
            
            document.getElementById('img').value = data.img || '';
            document.getElementById('tag_en').value = data.tag?.en || '';
            document.getElementById('tag_ka').value = data.tag?.ka || '';
            
            document.getElementById('text_en').value = data.text?.en || '';
            document.getElementById('text_ka').value = data.text?.ka || '';

            // Sub Items
            const container = document.getElementById('subitems-list');
            container.innerHTML = '';
            if(data.subItems && Array.isArray(data.subItems)) {
                data.subItems.forEach(sub => addSubItem(sub.title, sub.desc));
            }
            
            toggleFields();
            
            // Highlight list
            document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
            // (In real app, find and add active class)
        };

        window.createNew = () => {
            currentId = null;
            document.querySelectorAll('input, textarea').forEach(el => el.value = '');
            document.getElementById('subitems-list').innerHTML = '';
            document.getElementById('published').checked = true;
            toggleFields();
        };

        window.toggleFields = () => {
            const type = document.getElementById('type').value;
            const subSec = document.getElementById('subitems-section');
            const blogSec = document.getElementById('blog-section');
            const lblEn = document.getElementById('lbl_desc_en');
            const lblKa = document.getElementById('lbl_desc_ka');

            if(type === 'blog') {
                subSec.style.display = 'none';
                blogSec.style.display = 'block';
                lblEn.innerText = "Date (English)";
                lblKa.innerText = "Date (Georgian)";
            } else {
                subSec.style.display = 'block';
                blogSec.style.display = 'none';
                lblEn.innerText = "Short Description (English)";
                lblKa.innerText = "Short Description (Georgian)";
            }
        };

        window.addSubItem = (t = '', d = '') => {
            const div = document.createElement('div');
            div.className = 'sub-item-row';
            div.innerHTML = `
                <div style="flex:1">
                    <input type="text" placeholder="Title (e.g., Day 1)" class="sub-title" value="${t}" style="margin-bottom:5px">
                    <textarea placeholder="Details..." class="sub-desc" style="height:60px">${d}</textarea>
                </div>
                <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('subitems-list').appendChild(div);
        };

        // --- SAVE ---
        window.saveCurrent = async () => {
            const type = document.getElementById('type').value;
            
            // Collect Sub Items
            let subItems = [];
            document.querySelectorAll('.sub-item-row').forEach(row => {
                subItems.push({
                    title: row.querySelector('.sub-title').value,
                    desc: row.querySelector('.sub-desc').value
                });
            });

            const data = {
                region: document.getElementById('region').value,
                type: type,
                published: document.getElementById('published').checked,
                title: { en: document.getElementById('title_en').value, ka: document.getElementById('title_ka').value },
                img: document.getElementById('img').value,
                tag: { en: document.getElementById('tag_en').value, ka: document.getElementById('tag_ka').value }
            };

            if(type === 'blog') {
                data.date = { en: document.getElementById('desc_en').value, ka: document.getElementById('desc_ka').value };
                data.text = { en: document.getElementById('text_en').value, ka: document.getElementById('text_ka').value };
            } else {
                data.desc = { en: document.getElementById('desc_en').value, ka: document.getElementById('desc_ka').value };
                data.subItems = subItems;
            }

            try {
                if(currentId) {
                    await updateDoc(doc(db, "content", currentId), data);
                } else {
                    await addDoc(collection(db, "content"), data);
                }
                showToast("Saved Successfully!");
                loadData();
            } catch(e) { alert(e.message); }
        };

        window.deleteCurrent = async () => {
            if(!currentId) return;
            if(confirm("Delete this item?")) {
                await deleteDoc(doc(db, "content", currentId));
                showToast("Deleted.");
                createNew();
                loadData();
            }
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
        
        // --- DATA IMPORT UTILITY ---
        window.importHardcodedData = async () => {
            if(!confirm("This will upload all website data to Firebase. Do this only once! Continue?")) return;
            
            // PASTE THE HUGE DATABASE CONST HERE FROM INDEX.HTML IF YOU WANT TO IMPORT IT
            // Since I cannot access the other file's variable directly without cors/parsing, 
            // users usually copy the 'const database = ...' block here temporarily to run this.
            // For now, I'll assume you want to start fresh or manually add. 
            alert("To import, open the console (F12) and paste the database object, then call upload function. Or just add items manually!");
        };

    </script>
</body>
</html>
