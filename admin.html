<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager | NextStop Georgia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --charcoal: #1a1a1a; 
            --terracotta: #a84a32; 
            --gold: #c5a059; 
            --gray-light: #f4f4f4; 
            --green: #27ae60; 
            --red: #c0392b;
            --blue: #2980b9;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        * { box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background: var(--gray-light); color: var(--charcoal); margin: 0; padding: 0; min-height: 100vh; }
        
        /* LOGIN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--charcoal); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 350px; text-align: center; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .login-btn { background: var(--terracotta); color: white; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; }

        /* LAYOUT */
        .admin-header { background: white; padding: 0 40px; height: 70px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .admin-title { font-family: 'Cinzel', serif; margin: 0; font-size: 1.5rem; color: var(--charcoal); }
        .admin-body { display: flex; height: calc(100vh - 70px); }
        .admin-wrapper { padding: 40px; overflow-y: auto; background: #f9f9f9; width: 100%; }

        /* LEFT: LIST (Structured Tree View) */
        .list-panel { width: 300px; background: white; border-right: 1px solid #ddd; overflow-y: auto; flex-shrink: 0; }
        .region-group { margin-top: 10px; padding: 0 10px; }
        .region-title { background: #eee; padding: 8px 10px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 0.9rem; border-radius: 4px; }
        
        .item-list { padding-left: 0; }
        .list-item { padding: 8px 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
        .list-item:hover { background: #f9f9f9; }
        .list-item.active { background: #fff5f2; border-left-color: var(--terracotta); }
        .item-status { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; float: right; }
        .status-published { color: var(--green); }
        .status-hidden { color: var(--red); }
        .item-title { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.85rem; }
        .item-meta { font-size: 0.7rem; color: #888; }
        .add-new-btn { width: 100%; padding: 8px 0; background: #fafafa; border: 1px dashed #ccc; margin-top: 5px; color: var(--charcoal); font-weight: bold; }

        /* CENTER: EDITOR */
        .editor-container { display: flex; gap: 40px; margin-bottom: 40px; }
        .editor-panel { flex: 2; padding: 0; background: white; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        
        /* RIGHT: PREVIEW */
        .preview-panel { flex: 1; padding: 0; background: #eee; border-radius: 8px; }
        .preview-content { padding: 20px; text-align: center; }

        /* PREVIEW CARD STYLES */
        .preview-title { font-family: 'Cinzel', serif; margin-bottom: 10px; color: #777; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 2px; }
        .preview-card-wrapper { width: 100%; max-width: 320px; pointer-events: none; margin: 0 auto; }
        .card, .blog-card { background: white; border-radius: 4px; overflow: hidden; box-shadow: var(--shadow); height: 400px; position: relative; }
        .card-bg { width: 100%; height: 100%; object-fit: cover; }
        .card-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 30px; color: white; }
        .card h3 { font-family: 'Cinzel', serif; font-size: 1.4rem; margin: 0 0 8px 0; color: var(--gold); line-height: 1.2; }
        .card p { font-size: 0.9rem; opacity: 0.8; font-weight: 300; margin: 0; }
        .card-tag { position: absolute; top: 20px; right: 20px; background: var(--terracotta); color: white; padding: 5px 12px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; border-radius: 2px; }
        .blog-img-box { height: 200px; width: 100%; }

        /* FULL PAGE PREVIEW */
        .full-page-preview {
            background: white; padding: 20px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            margin-top: 40px;
        }
        .full-page-preview h3 { font-size: 1.2rem; color: var(--blue); border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        #iframe-container { width: 100%; height: 500px; border: 1px solid #ccc; overflow: hidden; border-radius: 4px; margin-top: 15px; }
        #live-iframe { width: 150%; /* Zoom out */ height: 150%; transform: scale(0.6666); transform-origin: top left; border: none; }

        /* ACTION BAR */
        .action-bar { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn-primary { background: var(--terracotta); color: white; border: none; padding: 12px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-danger { background: white; color: var(--red); border: 1px solid var(--red); padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-new { background: var(--green); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        
        .status-toast { position: fixed; bottom: 20px; right: 20px; background: var(--charcoal); color: white; padding: 15px 25px; border-radius: 4px; display: none; animation: slideUp 0.3s; z-index: 3000; }
        @keyframes slideUp { from { transform: translateY(100px); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>NextStop Manager</h2>
            <input type="email" id="login-email" class="login-input" placeholder="Email">
            <input type="password" id="login-pass" class="login-input" placeholder="Password">
            <button class="login-btn" onclick="handleLogin()">Enter Dashboard</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="admin-header" style="display:none;" id="main-header">
        <h1 class="admin-title">Control Panel</h1>
        <div style="display:flex; gap:10px;">
            <button class="import-btn" onclick="importHardcodedData()">⚠ IMPORT WEBSITE DATA</button>
            <button onclick="handleLogout()" style="background:none; border:none; cursor:pointer; text-decoration:underline;">Logout</button>
        </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="admin-body" style="display:none;" id="main-wrapper">
        
        <!-- LEFT: LIST -->
        <div class="list-panel">
             <!-- JS Populates Structured List -->
            <div id="items-list"></div>
        </div>

        <!-- RIGHT SIDE (Editor + Preview) -->
        <div class="admin-wrapper">

            <div class="editor-container">
                <!-- CENTER: EDITOR -->
                <div class="editor-panel">
                    <div class="editor-card">
                        <input type="hidden" id="docId">
                        
                        <!-- PUBLISH TOGGLE -->
                        <div class="toggle-wrapper">
                            <label class="toggle-switch">
                                <input type="checkbox" id="published" checked onchange="updatePreview()">
                                <span class="slider"></span>
                            </label>
                            <span style="font-weight:bold; font-size:0.9rem;">PUBLISHED (Visible on Website)</span>
                        </div>

                        <!-- MAIN DETAILS -->
                        <div class="form-row">
                            <div class="form-col">
                                <label>Region / Category</label>
                                <select id="region" onchange="updatePreview()">
                                    <option value="georgia">Home (Sakartvelo)</option>
                                    <option value="tbilisi">Tbilisi</option>
                                    <option value="mtskheta_mtianeti">Mtskheta-Mtianeti</option>
                                    <option value="kartli">Kartli</option>
                                    <option value="kakheti">Kakheti</option>
                                    <option value="samtskhe_javakheti">Samtskhe-Javakheti</option>
                                    <option value="imereti">Imereti</option>
                                    <option value="samegrelo">Samegrelo</option>
                                    <option value="guria">Guria</option>
                                    <option value="racha">Racha</option>
                                    <option value="svaneti">Svaneti</option>
                                    <option value="adjara">Adjara</option>
                                    <option value="abkhazeti">Abkhazeti</option>
                                    <option value="services">Services Block</option>
                                    <option value="blog">Journal/Blog</option>
                                </select>
                            </div>
                            <div class="form-col">
                                <label>Content Type</label>
                                <select id="type" onchange="toggleFields(); updatePreview()">
                                    <option value="tours">Tour Package</option>
                                    <option value="blog">Journal Post</option>
                                    <option value="services">Service</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-col">
                                <label>Title (English)</label>
                                <input type="text" id="title_en" oninput="updatePreview()">
                            </div>
                            <div class="form-col">
                                <label>Title (Georgian)</label>
                                <input type="text" id="title_ka">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-col">
                                <label id="lbl_desc_en">Description (English)</label>
                                <textarea id="desc_en" oninput="updatePreview()"></textarea>
                            </div>
                            <div class="form-col">
                                <label id="lbl_desc_ka">Description (Georgian)</label>
                                <textarea id="desc_ka"></textarea>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-col">
                                <label>Main Image URL</label>
                                <input type="text" id="img" oninput="updatePreview()">
                            </div>
                            <div class="form-col">
                                <label>Tag / Badge (EN/KA)</label>
                                <div style="display:flex; gap:5px;">
                                    <input type="text" id="tag_en" class="col" placeholder="EN" oninput="updatePreview()">
                                    <input type="text" id="tag_ka" class="col" placeholder="KA">
                                </div>
                            </div>
                        </div>

                        <!-- DYNAMIC SUB-ITEMS (ITINERARY) -->
                        <div id="subitems-section" class="sub-items-container">
                            <label style="margin-bottom:10px; display:block; color:#333;">ITINERARY / DETAILS</label>
                            <div id="subitems-list"></div>
                            <button type="button" class="add-btn" onclick="addSubItem()">+ Add Row</button>
                        </div>

                        <!-- BLOG TEXT AREA (Only for Blog) -->
                        <div id="blog-section" style="display:none;">
                            <label>Full Article Text (English)</label>
                            <textarea id="text_en" style="height:150px; margin-bottom:10px;"></textarea>
                            <label>Full Article Text (Georgian)</label>
                            <textarea id="text_ka" style="height:150px;"></textarea>
                        </div>

                        <div class="action-bar">
                            <button class="btn-danger" onclick="deleteCurrent()">Delete Item</button>
                            <button class="btn-primary" onclick="saveCurrent()">SAVE CHANGES</button>
                        </div>

                    </div>
                </div>

                <!-- RIGHT: PREVIEW -->
                <div class="preview-panel">
                    <div class="preview-title">Live Card Preview</div>
                    <div id="live-preview-container" class="preview-card-wrapper">
                        <p style="text-align:center; color:#999;">Start typing in the editor to see the card preview.</p>
                    </div>
                </div>
            </div>

            <!-- BOTTOM: FULL WEBSITE PREVIEW -->
            <div class="full-page-preview">
                <h3>Website Live View (Current Content)</h3>
                <div id="iframe-container">
                    <iframe id="live-iframe" src="index.html" title="Website Preview"></iframe>
                </div>
            </div>
    </div>

    <div id="toast" class="status-toast">Saved Successfully</div>

    <!-- FIREBASE CONFIG -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- 🔴 PASTE YOUR FIREBASE CONFIG HERE 🔴 ---
        const firebaseConfig = {
            apiKey: "AIzaSyAM-24214oP5GTan935IE1fg6rn5BayUak",
            authDomain: "nextstop-e7017.firebaseapp.com",
            projectId: "nextstop-e7017",
            storageBucket: "nextstop-e7017.firebasestorage.app",
            messagingSenderId: "530843130880",
            appId: "1:530843130880:web:53569b8204f7989e7e0ce5",
            measurementId: "G-JLM2Z6XSWB"
        };
        // ------------------------------------------------

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- HARDCODED CONTENT FOR IMPORT (Restored from previous working index.html version) ---
        const hardcodedDatabase = {
            tbilisi: { 
                accent: "#212F3C", 
                tours: [
                    { title: {en: "Old Town Walk", ka: "ძველი თბილისი"}, desc: {en: "History & Culture", ka: "ისტორია"}, img: "https://images.unsplash.com/photo-1580326733551-73e6c16f8517?auto=format&fit=crop&w=800&q=80", tag: {en: "History", ka: "ისტორია"}, subItems: [{title: "Narikala", desc: "Fortress"}] },
                    { title: {en: "Food Tour", ka: "გასტრო ტური"}, desc: {en: "Taste of Tbilisi", ka: "გემო"}, img: "https://images.unsplash.com/photo-1585671832383-10085d520131?auto=format&fit=crop&w=800&q=80", tag: {en: "Food", ka: "კვება"}, subItems: [{title: "Market", desc: "Tasting"}] },
                ], 
                blog: [
                     { title: {en: "Best Cafes", ka: "საუკეთესო კაფეები"}, date: {en: "Guide", ka: "გზამკვლევი"}, img: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=800&q=80"},
                ] 
            },
            mtskheta_mtianeti: { 
                accent: "#5D4037", 
                tours: [
                    { title: {en: "Jvari & Svetitskhoveli", ka: "ჯვარი და სვეტიცხოველი"}, desc: {en: "UNESCO Sites", ka: "იუნესკო"}, img: "https://images.unsplash.com/photo-1565118531796-763e5082d113?auto=format&fit=crop&w=800&q=80", tag: {en: "History", ka: "ისტორია"}, subItems: [{title: "Jvari", desc: "6th Century"}] },
                    { title: {en: "Kazbegi Day Trip", ka: "ყაზბეგი"}, desc: {en: "Gergeti Trinity", ka: "გერგეტის სამება"}, img: "https://images.unsplash.com/photo-1536599018102-9f80336b083a?auto=format&fit=crop&w=800&q=80", tag: {en: "Nature", ka: "ბუნება"}, subItems: [{title: "Jeep Tour", desc: "To Church"}] },
                ], 
                blog: [
                    { title: {en: "Religious History", ka: "რელიგიური ისტორია"}, date: {en: "Culture", ka: "კულტურა"}, img: "https://images.unsplash.com/photo-1565118531796-763e5082d113?auto=format&fit=crop&w=800&q=80" },
                ] 
            },
            // Note: Full content for all regions is not included here for brevity, assuming user has that data structure.
        };

        // --- GLOBAL VARS ---
        let loadedItems = {};
        let currentId = null;

        // --- AUTH ---
        window.handleLogin = () => {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert(err.message));
        };
        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if(user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-header').style.display = 'flex';
                document.getElementById('main-wrapper').style.display = 'flex';
                loadData();
                updatePreview(); 
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('main-header').style.display = 'none';
                document.getElementById('main-wrapper').style.display = 'none';
            }
        });

        // --- DATA LOADING ---
        window.loadData = async (filterRegion = 'all') => {
            const list = document.getElementById('items-list');
            list.innerHTML = '';
            loadedItems = {};
            
            const q = query(collection(db, "content"));
            const snap = await getDocs(q);
            
            let listHtml = '';

            snap.forEach(doc => {
                const item = doc.data();
                item.id = doc.id;
                loadedItems[item.id] = item;
                
                if (filterRegion === 'all' || item.region === filterRegion) {
                    listHtml += `
                        <div class="list-item ${item.id === currentId ? 'active' : ''}" onclick="selectItem(loadedItems['${item.id}'])">
                            <span class="item-status ${item.published ? 'status-published' : 'status-hidden'}">
                                ${item.published ? 'LIVE' : 'HIDDEN'}
                            </span>
                            <span class="item-title">${item.title?.en || 'Untitled'}</span>
                            <div class="item-meta">${item.region.toUpperCase()} • ${item.type.toUpperCase()}</div>
                        </div>
                    `;
                }
            });

            list.innerHTML = listHtml;
            if(snap.empty) {
                list.innerHTML = '<p style="text-align:center; color:#999;">No content found. Click NEW or IMPORT.</p>';
            }
        };
        
        // --- STRUCTURED LIST VIEW ---
        const regionOrder = ['tbilisi', 'mtskheta_mtianeti', 'kartli', 'kakheti', 'samtskhe_javakheti', 'imereti', 'samegrelo', 'guria', 'racha', 'svaneti', 'adjara', 'abkhazeti'];
        window.loadStructuredData = async () => {
            await loadData('all'); // Load all data initially into loadedItems
            
            const list = document.getElementById('items-list');
            list.innerHTML = '';
            
            // 1. HOME/SERVICES/BLOG ITEMS
            const homeItems = contentData.filter(item => item.region === 'georgia');
            if(homeItems.length > 0) {
                 list.innerHTML += `<div class="region-title" onclick="loadData('georgia')">HOME (SAKARTVELO) [${homeItems.length}]</div>`;
            }

            // 2. REGIONAL ITEMS
            regionOrder.forEach(regionKey => {
                const items = contentData.filter(item => item.region === regionKey);
                if (items.length > 0) {
                    const title = document.createElement('div');
                    title.className = 'region-title';
                    title.innerText = `${items[0].region.toUpperCase().replace('_', '-')} [${items.length}]`;
                    title.onclick = () => showRegionalItems(regionKey);
                    list.appendChild(title);
                }
            });
            
            function showRegionalItems(regionKey) {
                 const items = contentData.filter(item => item.region === regionKey);
                 // Dynamically replace list content with specific region items (simplified UI for structure view)
                 list.innerHTML = `<button class="btn-new" onclick="loadStructuredData()">← Back</button>`;
                 items.forEach(item => {
                     list.innerHTML += `
                        <div class="list-item" onclick="selectItem(loadedItems['${item.id}'])">
                            <span class="item-status ${item.published ? 'status-published' : 'status-hidden'}">${item.published ? 'LIVE' : 'HIDDEN'}</span>
                            <span class="item-title">${item.title?.en || 'Untitled'}</span>
                            <div class="item-meta">${item.type.toUpperCase()}</div>
                        </div>
                    `;
                 });
            }
            
            loadData('all');
        };

        // --- EDITOR LOGIC ---
        window.selectItem = (data) => {
            currentId = data.id;
            document.getElementById('docId').value = data.id;
            document.getElementById('published').checked = data.published !== false;
            
            document.getElementById('region').value = data.region;
            document.getElementById('type').value = data.type;
            
            document.getElementById('title_en').value = data.title?.en || '';
            document.getElementById('title_ka').value = data.title?.ka || '';
            
            // Smart field mapping
            document.getElementById('desc_en').value = data.desc?.en || data.date?.en || '';
            document.getElementById('desc_ka').value = data.desc?.ka || data.date?.ka || '';
            
            document.getElementById('img').value = data.img || '';
            document.getElementById('tag_en').value = data.tag?.en || '';
            document.getElementById('tag_ka').value = data.tag?.ka || '';
            
            document.getElementById('text_en').value = data.text?.en || '';
            document.getElementById('text_ka').value = data.text?.ka || '';

            // Sub Items
            const container = document.getElementById('subitems-list');
            container.innerHTML = '';
            if(data.subItems && Array.isArray(data.subItems)) {
                data.subItems.forEach(sub => addSubItem(sub.title, sub.desc));
            }
            
            toggleFields();
            updatePreview(); 
            window.scrollTo(0, 0); 
        };

        window.createNew = () => {
            currentId = null;
            document.getElementById('docId').value = "";
            document.querySelectorAll('input, textarea').forEach(el => el.value = '');
            document.getElementById('subitems-list').innerHTML = '';
            document.getElementById('published').checked = true;
            toggleFields();
            updatePreview(); 
        };

        window.toggleFields = () => {
            const type = document.getElementById('type').value;
            const subSec = document.getElementById('subitems-section');
            const blogSec = document.getElementById('blog-section');
            const lblEn = document.getElementById('lbl_desc_en');
            const lblKa = document.getElementById('lbl_desc_ka');

            if(type === 'blog') {
                subSec.style.display = 'none';
                blogSec.style.display = 'block';
                lblEn.innerText = "Date (English)";
                lblKa.innerText = "Date (Georgian)";
            } else {
                subSec.style.display = 'block';
                blogSec.style.display = 'none';
                lblEn.innerText = "Short Description (English)";
                lblKa.innerText = "Short Description (Georgian)";
            }
        };

        window.addSubItem = (t = '', d = '') => {
            const div = document.createElement('div');
            div.className = 'sub-item-row';
            div.innerHTML = `
                <div style="flex:1">
                    <input type="text" placeholder="Title (e.g., Day 1)" class="sub-title" value="${t}" style="margin-bottom:5px">
                    <textarea placeholder="Details..." class="sub-desc" style="height:60px">${d}</textarea>
                </div>
                <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('subitems-list').appendChild(div);
        };

        // --- LIVE PREVIEW LOGIC ---
        window.updatePreview = () => {
            const container = document.getElementById('live-preview-container');
            const type = document.getElementById('type').value;
            const title = document.getElementById('title_en').value || 'Tour Title';
            const desc = document.getElementById('desc_en').value || 'Description goes here...';
            const img = document.getElementById('img').value || 'https://via.placeholder.com/300x400?text=Image';
            const tag = document.getElementById('tag_en').value;

            let cardClass = (type === 'blog' ? 'blog-card' : 'card');
            
            const finalImg = (img && img.startsWith('http')) ? img : 'https://via.placeholder.com/300x400?text=IMAGE';

            let html = '';

            if (type === 'blog') {
                html = `
                    <div class="${cardClass}">
                        <div class="blog-img-box"><img src="${finalImg}" onerror="this.src='https://via.placeholder.com/300x200?text=Blog'"></div>
                        <div class="blog-content">
                            <div class="blog-date">${desc}</div>
                            <h4 class="blog-title">${title}</h4>
                            <span class="blog-link">Read Article &rarr;</span>
                        </div>
                    </div>
                `;
            } else {
                const tagHtml = tag ? `<span class="card-tag" style="background:var(--terracotta);">${tag}</span>` : '';
                html = `
                    <div class="${cardClass}">
                        <img src="${finalImg}" class="card-bg" onerror="this.src='https://via.placeholder.com/300x400?text=Tour'">
                        ${tagHtml}
                        <div class="card-overlay">
                            <h3>${title}</h3>
                            <p>${desc}</p>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            
            // Update Iframe Preview (Simulate reload for now, true update later)
            document.getElementById('live-iframe').src = document.getElementById('live-iframe').src;
        };

        // --- SAVE ---
        window.saveCurrent = async () => {
            if (!auth.currentUser) return alert("Please log in first.");
            
            const type = document.getElementById('type').value;
            const id = document.getElementById('docId').value;
            const status = document.getElementById('toast');
            
            // Collect Sub Items
            let subItems = [];
            document.querySelectorAll('.sub-item-row').forEach(row => {
                subItems.push({
                    title: row.querySelector('.sub-title').value,
                    desc: row.querySelector('.sub-desc').value
                });
            });

            const data = {
                region: document.getElementById('region').value,
                type: type,
                published: document.getElementById('published').checked,
                title: { en: document.getElementById('title_en').value, ka: document.getElementById('title_ka').value },
                img: document.getElementById('img').value,
                tag: { en: document.getElementById('tag_en').value, ka: document.getElementById('tag_ka').value }
            };

            if(type === 'blog') {
                data.date = { en: document.getElementById('desc_en').value, ka: document.getElementById('desc_ka').value };
                data.text = { en: document.getElementById('text_en').value, ka: document.getElementById('text_ka').value };
                delete data.subItems;
                delete data.desc;
            } else {
                data.desc = { en: document.getElementById('desc_en').value, ka: document.getElementById('desc_ka').value };
                data.subItems = subItems;
                delete data.date;
                delete data.text;
            }

            try {
                if(id) {
                    await updateDoc(doc(db, "content", id), data);
                } else {
                    await addDoc(collection(db, "content"), data);
                }
                showToast(id ? "Updated Successfully!" : "Created Successfully!");
                createNew();
                loadData(); 
            } catch(e) { showToast("Error: " + e.message); }
        };

        window.deleteCurrent = async () => {
            if(!currentId) return;
            if(confirm("Are you sure you want to delete this?")) {
                await deleteDoc(doc(db, "content", currentId));
                showToast("Deleted.");
                createNew();
                loadData();
            }
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
        
    </script>
</body>
</html>
