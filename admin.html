<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | NextStop Georgia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --charcoal: #1a1a1a; --terracotta: #a84a32; --gray-light: #f4f4f4; }
        * { box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background: var(--gray-light); color: var(--charcoal); margin: 0; padding: 40px; min-height: 100vh; }
        
        /* LOGIN SCREEN */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--charcoal); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 8px; width: 350px; text-align: center;
        }
        .login-box h2 { margin-top: 0; font-family: 'Cinzel', serif; color: var(--terracotta); }
        .login-btn {
            background: var(--charcoal); color: white; width: 100%; padding: 12px;
            border: none; margin-top: 20px; cursor: pointer; font-weight: bold;
        }

        /* DASHBOARD */
        .admin-container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: none; }
        h1 { font-family: 'Cinzel', serif; color: var(--charcoal); border-bottom: 2px solid var(--terracotta); padding-bottom: 15px; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        textarea { height: 100px; resize: vertical; }
        
        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        
        .btn-save { background: var(--terracotta); color: white; border: none; padding: 15px 30px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; transition: 0.3s; }
        .btn-save:hover { background: #8a3b26; }

        .status-msg { margin-top: 15px; text-align: center; font-weight: bold; display: none; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>NextStop Admin</h2>
            <p>Please sign in to edit content.</p>
            <input type="email" id="email" placeholder="Email" style="margin-bottom: 10px;">
            <input type="password" id="password" placeholder="Password">
            <button class="login-btn" onclick="login()">Secure Login</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD (Hidden until login) -->
    <div class="admin-container" id="dashboard">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>Content Manager</h1>
            <button onclick="logout()" style="background:none; border:none; text-decoration:underline; cursor:pointer;">Logout</button>
        </div>

        <div class="form-group">
            <label>Category / Region</label>
            <select id="regionSelect">
                <option value="georgia">Main Page (Georgia)</option>
                <option value="tbilisi">Tbilisi</option>
                <option value="kakheti">Kakheti</option>
                <option value="kazbegi">Kazbegi</option>
                <option value="svaneti">Svaneti</option>
                <option value="adjara">Adjara</option>
                <option value="abkhazeti">Abkhazeti</option>
                <option value="imereti">Imereti</option>
                <option value="samegrelo">Samegrelo</option>
                <option value="guria">Guria</option>
                <option value="racha">Racha</option>
                <option value="kartli">Kartli</option>
            </select>
        </div>

        <div class="form-group">
            <label>Type of Content</label>
            <select id="contentType">
                <option value="tours">Tour Package</option>
                <option value="blog">Journal Post</option>
            </select>
        </div>

        <!-- ENGLISH CONTENT -->
        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label>Title (English)</label>
                    <input type="text" id="title_en" placeholder="e.g., Wine Tasting">
                </div>
                <div class="form-group">
                    <label>Short Desc (English)</label>
                    <textarea id="desc_en" placeholder="e.g., 3 Day tour..."></textarea>
                </div>
            </div>
            
            <!-- GEORGIAN CONTENT -->
            <div class="col">
                <div class="form-group">
                    <label>Title (Georgian)</label>
                    <input type="text" id="title_ka" placeholder="მაგ: ღვინის ტური">
                </div>
                <div class="form-group">
                    <label>Short Desc (Georgian)</label>
                    <textarea id="desc_ka" placeholder="მაგ: 3 დღიანი ტური..."></textarea>
                </div>
            </div>
        </div>

        <!-- MEDIA -->
        <div class="form-group">
            <label>Image Link (URL)</label>
            <input type="text" id="imgUrl" placeholder="https://...">
        </div>
        
        <div class="form-group">
            <label>Tag (e.g., Adventure, Relax)</label>
            <input type="text" id="tag" placeholder="Tag Name">
        </div>

        <button class="btn-save" onclick="saveData()">Save to Website</button>
        <p id="status" class="status-msg"></p>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- 🔴 PASTE YOUR FIREBASE CONFIG HERE 🔴 ---
        const firebaseConfig = {
           apiKey: "AIzaSyAM-24214oP5GTan935IE1fg6rn5BayUak",
  authDomain: "nextstop-e7017.firebaseapp.com",
  projectId: "nextstop-e7017",
  storageBucket: "nextstop-e7017.firebasestorage.app",
  messagingSenderId: "530843130880",
  appId: "1:530843130880:web:53569b8204f7989e7e0ce5",
  measurementId: "G-JLM2Z6XSWB"  // Paste the code from Firebase Console here (apiKey, authDomain, etc.)
        };
        // ------------------------------------------------

        // Initialize Firebase
        let app, db, auth;
        
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.log("Waiting for config...");
        }

        // --- AUTH LOGIC ---
        window.login = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass)
                .catch((error) => alert("Error: " + error.message));
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('dashboard').style.display = 'none';
            }
        });

        // --- SAVE LOGIC ---
        window.saveData = async () => {
            if (!db) return alert("Database not connected! Check your config.");
            
            const region = document.getElementById('regionSelect').value;
            const type = document.getElementById('contentType').value;
            const status = document.getElementById('status');

            const data = {
                region: region,
                type: type,
                title: { en: document.getElementById('title_en').value, ka: document.getElementById('title_ka').value },
                desc: { en: document.getElementById('desc_en').value, ka: document.getElementById('desc_ka').value }, // Used for Tours
                date: { en: document.getElementById('desc_en').value, ka: document.getElementById('desc_ka').value }, // Used for Blog (reusing field)
                img: document.getElementById('imgUrl').value,
                tag: { en: document.getElementById('tag').value, ka: document.getElementById('tag').value } // Simplified tag for now
            };

            status.innerText = "Saving...";
            status.style.display = "block";
            status.className = "status-msg";

            try {
                await addDoc(collection(db, "content"), data);
                status.innerText = "✅ Saved Successfully! (Note: Website update requires Step 2)";
                status.className = "status-msg success";
                
                // Clear form
                document.getElementById('title_en').value = "";
                document.getElementById('imgUrl').value = "";
            } catch (e) {
                status.innerText = "❌ Error: " + e.message;
                status.className = "status-msg error";
            }
        };
    </script>
</body>
</html>
