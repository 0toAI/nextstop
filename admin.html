<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager | NextStop Georgia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --charcoal: #1a1a1a; 
            --terracotta: #a84a32; 
            --gold: #c5a059; 
            --gray-light: #f4f4f4; 
            --green: #27ae60; 
            --red: #c0392b;
            --blue: #2980b9;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        * { box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background: var(--gray-light); color: var(--charcoal); margin: 0; padding: 0; min-height: 100vh; }
        
        /* LOGIN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--charcoal); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 350px; text-align: center; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .login-btn { background: var(--terracotta); color: white; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; }

        /* HEADER & LAYOUT */
        .admin-header { 
            background: white; padding: 0 40px; height: 70px; border-bottom: 1px solid #ddd; 
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; 
        }
        .admin-title { font-family: 'Cinzel', serif; margin: 0; font-size: 1.5rem; color: var(--charcoal); }
        .admin-body { display: flex; height: calc(100vh - 70px); }
        .admin-content-area { padding: 20px 40px; overflow-y: auto; background: #f9f9f9; flex-grow: 1; }

        /* LEFT: LIST (Structured Tree View) */
        .list-panel { width: 300px; background: white; border-right: 1px solid #ddd; overflow-y: auto; flex-shrink: 0; }
        .region-group { margin-bottom: 10px; }
        
        .region-title { 
            background: #eee; padding: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; 
            font-size: 0.85rem; border-radius: 4px; color: var(--charcoal); transition: background 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .region-title:hover { background: #d3d3d3; }
        
        .toggle-arrow { transition: transform 0.3s; margin-left: 10px; }
        .region-group.expanded .toggle-arrow { transform: rotate(90deg); }

        .sub-list { 
            list-style: none; padding: 0; margin: 0; border: 1px solid #ddd; border-radius: 4px; 
            background: #fff; margin-top: 5px;
        }

        .list-item { 
            padding: 8px 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; 
            border-left: 4px solid transparent; 
        }
        .list-item:hover { background: #f9f9f9; }
        .list-item.active { background: #fff5f2; border-left-color: var(--terracotta); }
        
        .item-status { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; float: right; }
        .status-published { color: var(--green); }
        .status-hidden { color: var(--red); }
        .item-title { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.85rem; }
        .item-meta { font-size: 0.7rem; color: #888; }
        .add-new-btn { width: 100%; padding: 8px 0; background: #fafafa; border: 1px dashed #ccc; margin-top: 5px; color: var(--charcoal); font-weight: bold; border-radius: 4px; }

        /* EDITOR + PREVIEW CONTAINER */
        .editor-preview-container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }

        /* CENTER: EDITOR */
        .editor-panel { flex: 2; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        
        /* RIGHT: PREVIEW */
        .preview-panel { flex: 1; padding: 20px; background: #f0f0f0; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); height: fit-content; position: sticky; top: 100px; }
        .preview-title { font-family: 'Cinzel', serif; margin-bottom: 15px; color: #777; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 2px; text-align: center; }

        /* PREVIEW CARD STYLES */
        .preview-card-wrapper { width: 100%; max-width: 320px; pointer-events: none; margin: 0 auto; } 
        .card { background: white; border-radius: 4px; overflow: hidden; box-shadow: var(--shadow); height: 400px; position: relative; margin-bottom: 20px; }
        .card-bg { width: 100%; height: 100%; object-fit: cover; }
        .card-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 30px; color: white; }
        .card h3 { font-family: 'Cinzel', serif; font-size: 1.4rem; margin: 0 0 8px 0; color: var(--gold); line-height: 1.2; }
        .card p { font-size: 0.9rem; opacity: 0.8; font-weight: 300; margin: 0; }
        .card-tag { position: absolute; top: 20px; right: 20px; background: var(--terracotta); color: white; padding: 5px 12px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; border-radius: 2px; }
        
        /* Blog Preview Variant */
        .blog-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); height: auto; }
        .blog-img-box { height: 200px; width: 100%; }
        .blog-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .blog-content { padding: 25px; color: var(--charcoal); }
        .blog-date { font-size: 0.7rem; color: var(--terracotta); font-weight: 700; text-transform: uppercase; }
        .blog-title { font-size: 1.2rem; margin: 10px 0; font-family: 'Cinzel', serif; }
        .blog-link { font-size: 0.8rem; text-decoration: underline; color: #888; }

        /* FORM ELEMENTS */
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; }
        .form-col { flex: 1; }
        label { display: block; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #999; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem; }
        textarea { resize: vertical; min-height: 60px; }
        
        .toggle-wrapper { display: flex; align-items: center; gap: 10px; background: #f0f0f0; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
        
        .action-bar { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn-primary { background: var(--terracotta); color: white; border: none; padding: 12px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        .status-toast { position: fixed; bottom: 20px; right: 20px; background: var(--charcoal); color: white; padding: 15px 25px; border-radius: 4px; display: none; z-index: 3000; }
        .import-btn { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: auto; }

        /* FILE UPLOAD SPECIFIC STYLES */
        #upload-status { font-size: 0.8rem; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>NextStop Manager</h2>
            <input type="email" id="login-email" class="login-input" placeholder="Email">
            <input type="password" id="login-pass" class="login-input" placeholder="Password">
            <button class="login-btn" onclick="handleLogin()">Enter Dashboard</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="admin-header" style="display:none;" id="main-header">
        <h1 class="admin-title">Control Panel</h1>
        <div style="display:flex; gap:10px;">
            <button class="import-btn" onclick="importHardcodedData()">⚠ IMPORT WEBSITE DATA</button>
            <button onclick="handleLogout()" style="background:none; border:none; cursor:pointer; text-decoration:underline;">Logout</button>
        </div>
    </header>

    <!-- MAIN LAYOUT -->

            <div id="items-list">

            </div>
        </div>

        <!-- RIGHT SIDE (Editor + Preview) -->

                        <!-- PUBLISH TOGGLE -->

                            </label>

                        </div>

                        <!-- MAIN DETAILS -->
                        <div class="form-row">
                            <div class="form-col">
                                <label>Region / Category</label>
                                <select id="region" onchange="updatePreview()">
                                    <option value="georgia">Home (Sakartvelo)</option>
                                    <option value="tbilisi">Tbilisi</option>
                                    <option value="mtskheta_mtianeti">Mtskheta-Mtianeti</option>
                                    <option value="kartli">Kartli</option>
                                    <option value="kakheti">Kakheti</option>
                                    <option value="samtskhe_javakheti">Samtskhe-Javakheti</option>
                                    <option value="imereti">Imereti</option>
                                    <option value="samegrelo">Samegrelo</option>
                                    <option value="guria">Guria</option>
                                    <option value="racha">Racha</option>
                                    <option value="svaneti">Svaneti</option>
                                    <option value="adjara">Adjara</option>
                                    <option value="abkhazeti">Abkhazeti</option>
                                </select>
                            </div>
                            <div class="form-col">
                                <label>Content Type</label>
                                <select id="type" onchange="toggleFields(); updatePreview()">
                                    <option value="tours">Tour Package</option>
                                    <option value="blog">Journal Post</option>
                                    <option value="services">Service</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-col">
                                <label>Title (English)</label>
                                <input type="text" id="title_en" oninput="updatePreview()">
                            </div>
                            <div class="form-col">
                                <label>Title (Georgian)</label>
                                <input type="text" id="title_ka">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-col">
                                <label id="lbl_desc_en">Short Description (English)</label>
                                <textarea id="desc_en" oninput="updatePreview()"></textarea>
                            </div>
                            <div class="form-col">
                                <label id="lbl_desc_ka">Short Description (Georgian)</label>
                                <textarea id="desc_ka"></textarea>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-col">
                                <label>Main Image URL / Upload</label>
                                <input type="text" id="img" oninput="updatePreview()" placeholder="Paste Unsplash URL OR select file below">
                                <input type="file" id="file-upload" style="margin-top:5px;" onchange="handleFileUpload()">
                                <p id="upload-status"></p>
                            </div>
                            <div class="form-col">
                                <label>Tag / Badge (EN/KA)</label>
                                <div style="display:flex; gap:5px;">
                                    <input type="text" id="tag_en" class="col" placeholder="EN" oninput="updatePreview()">
                                    <input type="text" id="tag_ka" class="col" placeholder="KA">
                                </div>
                            </div>
                        </div>

                        <!-- DYNAMIC SUB-ITEMS (ITINERARY) -->
                        <div id="subitems-section" class="sub-items-container">
                            <label style="margin-bottom:10px; display:block; color:#333;">ITINERARY / DETAILS</label>
                            <div id="subitems-list"></div>
                            <button type="button" class="add-btn" onclick="addSubItem()">+ Add Row</button>
                        </div>

                        <!-- BLOG TEXT AREA (Only for Blog) -->
                        <div id="blog-section" style="display:none;">
                            <label>Full Article Text (English)</label>
                            <textarea id="text_en" style="height:150px; margin-bottom:10px;"></textarea>
                            <label>Full Article Text (Georgian)</label>
                            <textarea id="text_ka" style="height:150px;"></textarea>
                        </div>

                        <div class="action-bar">
                            <button class="btn-danger" onclick="deleteCurrent()">Delete Item</button>
                            <button class="btn-primary" onclick="saveCurrent()">SAVE CHANGES</button>
                        </div>

                    </div>
                </div>

                <!-- RIGHT: PREVIEW -->
                <div class="preview-panel">
                    <div class="preview-title">Live Card Preview</div>
                    <div id="live-preview-container" class="preview-card-wrapper">
                        <p style="text-align:center; color:#999;">Start typing in the editor to see the card preview.</p>
                    </div>
                </div>
            </div>

            <!-- BOTTOM: FULL WEBSITE PREVIEW (Removed) -->
    </div>

    <div id="toast" class="status-toast">Saved Successfully</div>

        // UTILITY: Shuffle
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // UTILITY: Hex to RGB
        function hexToRgb(hex) {
            var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? 
                parseInt(result[1], 16) + "," + parseInt(result[2], 16) + "," + parseInt(result[3], 16) 
                : "0,0,0";
        }

        // LOGIC
        let currentKey = 'georgia';
        let currentSlide = 0;
        let autoPlayTimer;

        function toggleLang() { setLanguage(localStorage.getItem('lang') === 'en' ? 'ka' : 'en'); }
        function setLanguage(lang) {
            if(!lang) lang = 'en';
            localStorage.setItem('lang', lang);
            document.getElementById('langBtn').innerText = lang === 'en' ? 'ENG' : 'GEO';
            document.querySelectorAll('[data-key]').forEach(el => el.innerText = translations[lang][el.getAttribute('data-key')] || el.innerText);
            init();
        }

        function openAbout() {
             const lang = localStorage.getItem('lang') || 'en';
             const content = `Travel is not just about moving; it is about access. When you decide to make Georgia your NextStop, you need a partner who can open every door.\n\nWe are a full-service agency designed to solve any challenge. Whether you seek the thrill of the mountains, the taste of our ancient wine culture, or a trusted guide for business and medical procedures, we handle the logistics so you can focus on the result.\n\nWe bridge the gap between your needs and the local reality.\nArrive as a guest, operate like a local.`;
             openModal(lang === 'en' ? "One Country. One Partner." : "ერთი ქვეყანა. ერთი პარტნიორი.", content, "https://images.unsplash.com/photo-1565008447742-97f6f38c985c?auto=format&fit=crop&w=800&q=80");
        }

        // MODAL FOR SERVICES LIST
        function openServicesModal() {
             const lang = localStorage.getItem('lang') || 'en';
             const title = translations[lang].section_services_title;
             
             const modalTitle = document.getElementById('modalTitle'); 
             const modalList = document.getElementById('modalList');
             const modalListView = document.getElementById('modalListView');
             const modalDetailView = document.getElementById('modalDetailView');
             const modalImg = document.getElementById('modalImg');
             const modal = document.getElementById('detailModal');
             
             modalTitle.innerText = title;
             modalList.innerHTML = '';
             modalImg.src = "https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=800&q=80"; 

             commonServices.forEach(s => {
                    const item = document.createElement('div'); item.className = 'modal-item';
                    item.onclick = () => {
                         window.open(`https://wa.me/${whatsapp}?text=I am interested in Service: ${s.title[lang]}`, '_blank');
                    };
                    item.innerHTML = `<div><div class="modal-item-title">${s.title[lang]}</div><div class="modal-item-desc">${s.desc[lang]}</div></div><div class="modal-item-arrow">&rarr;</div>`;
                    modalList.appendChild(item);
             });
             
             modalListView.style.display = 'block'; 
             modalDetailView.style.display = 'none';
             modal.classList.add('active');
        }

        function init() {
            renderRibbon();
            loadRegion(currentKey);
            document.querySelectorAll('.wa-link').forEach(a => { if(!a.classList.contains('modal-btn')) a.href = `https://wa.me/${whatsapp}`; });
        }

        function renderRibbon() {
            const ribbon = document.getElementById('destRibbon');
            const order = ['georgia', 'tbilisi', 'mtskheta_mtianeti', 'kartli', 'kakheti', 'samtskhe_javakheti', 'imereti', 'samegrelo', 'guria', 'racha', 'svaneti', 'adjara', 'abkhazeti'];
            ribbon.innerHTML = '';
            
            const labels = {
                georgia: { en: "SAKARTVELO", ka: "საქართველო" }, tbilisi: { en: "TBILISI", ka: "თბილისი" }, mtskheta_mtianeti: { en: "MTSKHETA-MTIANETI", ka: "მცხეთა-მთიანეთი" },
                kakheti: { en: "KAKHETI", ka: "კახეთი" }, kartli: { en: "KARTLI", ka: "ქართლი" }, samtskhe_javakheti: { en: "SAMTSKHE-JAVAKHETI", ka: "სამცხე-ჯავახეთი" },
                racha: { en: "RACHA-LECHKHUMI", ka: "რაჭა-ლეჩხუმი" }, svaneti: { en: "SVANETI", ka: "სვანეთი" }, imereti: { en: "IMERETI", ka: "იმერეთი" },
                guria: { en: "GURIA", ka: "გურია" }, samegrelo: { en: "SAMEGRELO", ka: "სამეგრელო" }, adjara: { en: "ADJARA", ka: "აჭარა" }, abkhazeti: { en: "ABKHAZETI", ka: "აფხაზეთი" }
            };
            
            const lang = localStorage.getItem('lang') || 'en';

            order.forEach(key => {
                if (key === 'georgia') {
                    const label = document.createElement('div');
                    label.className = 'ribbon-label';
                    label.innerText = labels[key][lang];
                    label.onclick = () => loadRegion(key);
                    
                    const sep = document.createElement('span');
                    sep.className = 'ribbon-separator';
                    sep.innerText = "|";
                    
                    ribbon.appendChild(label);
                    ribbon.appendChild(sep);
                } else {
                    const btn = document.createElement('button');
                    btn.className = `dest-btn ${key === currentKey ? 'active' : ''}`;
                    btn.setAttribute('data-region', key);
                    
                    const colorHex = database[key].accent;
                    btn.style.setProperty('--btn-rgb', hexToRgb(colorHex));
                    
                    btn.innerText = labels[key][lang];
                    btn.onclick = () => loadRegion(key);
                    
                    ribbon.appendChild(btn);
                }
            });
        }

        function loadRegion(key) {
            currentKey = key;
            const data = database[key];
            
            if(data.accent) {
                document.documentElement.style.setProperty('--terracotta', data.accent);
                document.querySelector('.logo-sub').style.color = data.accent;
                document.querySelector('.logo-sub').innerText = key === 'georgia' ? 'GEORGIA' : key.toUpperCase().replace('_', '-');
            }
            
            renderRibbon(); 

            // 1. Hero Logic
            let heroItems = database.georgia.hero;
            renderHero(heroItems);

            // 2. Tours Logic (Always Scroller, uses specific region data)
            let toursItems = data.tours || [];
            if (key === 'georgia') {
                 // On Home, manually push all regional tours and services for display purposes
                Object.keys(database).forEach(region => {
                    if (region !== 'georgia' && database[region].tours) {
                        toursItems.push(...database[region].tours);
                    }
                });
                toursItems.push(...commonServices);
                shuffle(toursItems);
            }
            renderScroller('travelGrid', toursItems, 'card');

            // 3. Services Logic (Show only on Home)
            const servicesSection = document.getElementById('services');
            const servicesLink = document.getElementById('servicesLink');
            
            if (key === 'georgia') {
                servicesSection.style.display = 'flex';
                renderScroller('servicesGrid', commonServices, 'card');
                servicesLink.href = "#services";
                servicesLink.removeAttribute('onclick');
            } else {
                servicesSection.style.display = 'none';
                servicesLink.href = "javascript:void(0)";
                servicesLink.setAttribute('onclick', 'openServicesModal()');
            }

            // 4. Blog Logic
            let blogItems = data.blog || [];
            if (key === 'georgia') {
                Object.keys(database).forEach(region => {
                    if (region !== 'georgia' && database[region].blog) {
                         blogItems.push(...database[region].blog);
                    }
                });
                shuffle(blogItems);
            }
            renderScroller('blogTrack', blogItems, 'blog');
        }

        function renderHero(slides) {
            const track = document.getElementById('heroTrack');
            const progContainer = document.getElementById('progressContainer');
            track.innerHTML = '';
            progContainer.innerHTML = '';
            const lang = localStorage.getItem('lang') || 'en';
            
            slides.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'hero-slide';
                if(index === 0) div.classList.add('active');
                
                const title = typeof item.title === 'object' ? item.title[lang] : item.title;
                let desc = "";
                let btnText = translations[lang].btn_details;
                
                if (item.date) { 
                    desc = item.date[lang];
                    btnText = translations[lang].btn_read;
                } else { 
                    desc = typeof item.desc === 'object' ? item.desc[lang] : item.desc;
                }
                
                const subContent = item.subItems ? item.subItems : (item.text ? item.text[lang] : '');

                const img = document.createElement('img');
                img.src = item.img;
                img.className = 'slide-bg';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'slide-content';
                
                const h2 = document.createElement('h2');
                h2.className = 'slide-title';
                h2.innerText = title;
                
                const p = document.createElement('p');
                p.className = 'slide-desc';
                p.innerText = desc;
                
                const btn = document.createElement('button');
                btn.className = 'slide-btn';
                btn.innerText = btnText;
                btn.onclick = () => openModal(title, subContent, item.img);
                
                contentDiv.appendChild(h2);
                contentDiv.appendChild(p);
                contentDiv.appendChild(btn);
                
                div.appendChild(img);
                div.appendChild(contentDiv);
                track.appendChild(div);

                const bar = document.createElement('div');
                bar.className = 'progress-bar';
                bar.innerHTML = `<div class="progress-fill" id="bar-${index}"></div>`;
                progContainer.appendChild(bar);
            });
            
            currentSlide = 0;
            // startStoryMode is intentionally commented out for manual control until we fix the DB logic later
        }

        function renderScroller(id, items, type) {
            const track = document.getElementById(id);
            track.innerHTML = '';
            const lang = localStorage.getItem('lang') || 'en';
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = type === 'blog' ? 'blog-card' : 'card';
                
                const title = item.title[lang];
                const subContent = item.subItems ? item.subItems : (item.text ? item.text[lang] : '');
                card.onclick = () => openModal(title, subContent, item.img);

                if (type === 'blog') {
                     card.innerHTML = `<div class="blog-img-box"><img src="${item.img}"></div><div class="blog-content"><div class="blog-date">${item.date[lang]}</div><h4 class="blog-title">${title}</h4><span class="blog-link">${translations[lang].btn_read}</span></div>`;
                } else {
                     const desc = item.desc[lang];
                     const tag = item.tag ? item.tag[lang] : '';
                     card.innerHTML = `<img src="${item.img}" class="card-bg"><div class="card-overlay">${tag ? `<span class="card-tag">${tag}</span>` : ''}<h3>${title}</h3><p>${desc}</p></div>`;
                }
                track.appendChild(card);
            });
        }

        function scrollSection(id, dir) {
            const container = document.getElementById(id);
            const scrollAmount = 300;
            container.scrollBy({ left: dir * scrollAmount, behavior: 'smooth' });
        }

        function startStoryMode() {} // Placeholder
        function showSlide(index) {} // Placeholder
        function manualSlide(dir) {} // Placeholder

        const modal = document.getElementById('detailModal'); const modalImg = document.getElementById('modalImg'); const modalTitle = document.getElementById('modalTitle'); const modalListView = document.getElementById('modalListView'); const modalList = document.getElementById('modalList'); const modalDetailView = document.getElementById('modalDetailView'); const detailTitle = document.getElementById('detailTitle'); const detailText = document.getElementById('detailText'); const detailBtn = document.getElementById('detailBtn');

        function openModal(title, content, img) {
            const lang = localStorage.getItem('lang') || 'en';
            modalImg.src = img;
            
            if (typeof content === 'string') {
                 modalTitle.innerText = title;
                 modalList.innerHTML = `<div class="modal-text">${content}</div><a href="https://wa.me/${whatsapp}" class="modal-btn wa-link">${translations[lang].btn_book}</a>`;
                 document.getElementById('modalListView').style.display = 'block'; modalDetailView.style.display = 'none';
            } else if (Array.isArray(content)) {
                modalTitle.innerText = title; modalList.innerHTML = '';
                content.forEach(sub => {
                    const item = document.createElement('div'); item.className = 'modal-item';
                    item.onclick = () => showDetail(sub, title);
                    item.innerHTML = `<div><div class="modal-item-title">${sub.title}</div><div class="modal-item-desc">${sub.desc}</div></div><div class="modal-item-arrow">&rarr;</div>`;
                    modalList.appendChild(item);
                });
                document.getElementById('modalListView').style.display = 'block'; modalDetailView.style.display = 'none';
            }
            modal.classList.add('active');
        }
        function showDetail(subItem, parentTitle) {
            const lang = localStorage.getItem('lang') || 'en';
            document.getElementById('modalListView').style.display = 'none'; modalDetailView.style.display = 'block';
            detailTitle.innerText = subItem.title; detailText.innerText = subItem.details || subItem.desc;
            detailBtn.innerText = translations[lang].btn_book;
            detailBtn.href = `https://wa.me/${whatsapp}?text=I am interested in ${parentTitle}: ${subItem.title}`;
        }
        function showList() { document.getElementById('modalListView').style.display = 'block'; modalDetailView.style.display = 'none'; }
        function closeModal() { modal.classList.remove('active'); }
        modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

        init();
    </script>
