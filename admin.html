<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager | NextStop Georgia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --charcoal: #1a1a1a; 
            --terracotta: #a84a32; 
            --gold: #c5a059; 
            --gray-light: #f4f4f4; 
            --green: #27ae60; 
            --red: #c0392b;
            --blue: #2980b9;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        * { box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background: var(--gray-light); color: var(--charcoal); margin: 0; padding: 0; min-height: 100vh; }
        
        /* LOGIN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--charcoal); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 350px; text-align: center; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .login-btn { background: var(--terracotta); color: white; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; }

        /* HEADER & LAYOUT */
        .admin-header { 
            background: white; padding: 0 40px; height: 70px; border-bottom: 1px solid #ddd; 
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; 
        }
        .admin-title { font-family: 'Cinzel', serif; margin: 0; font-size: 1.5rem; color: var(--charcoal); }
        .admin-body { display: flex; height: calc(100vh - 70px); }
        .admin-content-area { padding: 20px 40px; overflow-y: auto; background: #f9f9f9; flex-grow: 1; }

        /* LEFT: LIST (Structured Tree View) */
        .list-panel { width: 300px; background: white; border-right: 1px solid #ddd; overflow-y: auto; padding: 20px 0; flex-shrink: 0; }
        .region-group { margin-bottom: 10px; padding: 0 10px; }
        
        .region-title { 
            background: #e0e0e0; padding: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; 
            font-size: 0.85rem; border-radius: 4px; color: var(--charcoal); transition: background 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .region-title:hover { background: #d3d3d3; }
        
        .toggle-arrow { transition: transform 0.3s; margin-left: 10px; font-size: 0.8rem;}
        .region-group.expanded .toggle-arrow { transform: rotate(90deg); }

        .sub-list { 
            list-style: none; padding: 0; margin: 0; 
            display: none; 
        }
        .sub-list-item { 
            font-weight: bold; padding: 5px 10px; color: #555; 
            cursor: default; font-size: 0.8rem;
        }

        .list-item { 
            padding: 8px 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; 
            border-left: 4px solid transparent; 
            margin-left: 10px; 
            font-size: 0.85rem;
        }
        .list-item:hover { background: #fff5f2; }
        .list-item.active { background: #fff0eb; border-left-color: var(--terracotta); }
        
        .item-status { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; float: right; }
        .status-published { color: var(--green); }
        .status-hidden { color: var(--red); }
        .item-title { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.85rem; }
        .item-meta { font-size: 0.7rem; color: #888; }
        .add-new-btn { width: 100%; padding: 8px 0; background: #fafafa; border: 1px dashed #ccc; margin-top: 5px; color: var(--charcoal); font-weight: bold; border-radius: 4px; }

        /* EDITOR + PREVIEW CONTAINER */
        .editor-preview-container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }

        /* CENTER: EDITOR */
        .editor-panel { flex: 2; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        
        /* RIGHT: PREVIEW */
        .preview-panel { flex: 1; padding: 20px; background: #f0f0f0; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); height: fit-content; position: sticky; top: 100px; }
        .preview-title { font-family: 'Cinzel', serif; margin-bottom: 15px; color: #777; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 2px; text-align: center; }

        /* PREVIEW CARD STYLES */
        .preview-card-wrapper { width: 100%; max-width: 320px; pointer-events: none; margin: 0 auto; } 
        .card { background: white; border-radius: 4px; overflow: hidden; box-shadow: var(--shadow); height: 400px; position: relative; margin-bottom: 20px; }
        .card-bg { width: 100%; height: 100%; object-fit: cover; }
        .card-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 30px; color: white; }
        .card h3 { font-family: 'Cinzel', serif; font-size: 1.4rem; margin: 0 0 8px 0; color: var(--gold); line-height: 1.2; }
        .card p { font-size: 0.9rem; opacity: 0.8; font-weight: 300; margin: 0; }
        .card-tag { position: absolute; top: 20px; right: 20px; background: var(--terracotta); color: white; padding: 5px 12px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; border-radius: 2px; }
        
        /* Blog Preview Variant */
        .blog-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); height: auto; }
        .blog-img-box { height: 200px; width: 100%; }
        .blog-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .blog-content { padding: 25px; color: var(--charcoal); }
        .blog-date { font-size: 0.7rem; color: var(--terracotta); font-weight: 700; text-transform: uppercase; }
        .blog-title { font-size: 1.2rem; margin: 10px 0; font-family: 'Cinzel', serif; }
        .blog-link { font-size: 0.8rem; text-decoration: underline; color: #888; }

        /* FORM ELEMENTS */
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; }
        .form-col { flex: 1; }
        label { display: block; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #999; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem; }
        textarea { resize: vertical; min-height: 60px; }
        
        .toggle-wrapper { display: flex; align-items: center; gap: 10px; background: #f0f0f0; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
        
        .action-bar { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn-primary { background: var(--terracotta); color: white; border: none; padding: 12px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        .status-toast { position: fixed; bottom: 20px; right: 20px; background: var(--charcoal); color: white; padding: 15px 25px; border-radius: 4px; display: none; z-index: 3000; }
        .import-btn { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: auto; }

        /* FILE UPLOAD SPECIFIC STYLES */
        #upload-status { font-size: 0.8rem; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>NextStop Manager</h2>
            <input type="email" id="login-email" class="login-input" placeholder="Email">
            <input type="password" id="login-pass" class="login-input" placeholder="Password">
            <button class="login-btn" onclick="handleLogin()">Enter Dashboard</button>
        </div>
    </div>

    <!-- MAIN LAYOUT -->

        <!-- RIGHT SIDE (Editor + Preview) -->

                    <div class="editor-card">

                        <!-- PUBLISH TOGGLE -->

                            </label>

                        </div>

                        <!-- MAIN DETAILS -->
                        <div class="form-row">
                            <div class="form-col">
                                <label>Region / Category</label>
                                <select id="region" onchange="updatePreview()">
                                    <option value="georgia">Home (Sakartvelo)</option>
                                    <option value="tbilisi">Tbilisi</option>
                                    <option value="mtskheta_mtianeti">Mtskheta-Mtianeti</option>
                                    <option value="kartli">Kartli</option>
                                    <option value="kakheti">Kakheti</option>
                                    <option value="samtskhe_javakheti">Samtskhe-Javakheti</option>
                                    <option value="imereti">Imereti</option>
                                    <option value="samegrelo">Samegrelo</option>
                                    <option value="guria">Guria</option>
                                    <option value="racha">Racha</option>
                                    <option value="svaneti">Svaneti</option>
                                    <option value="adjara">Adjara</option>
                                    <option value="abkhazeti">Abkhazeti</option>
                                </select>
                            </div>
                            <div class="form-col">
                                <label>Content Type</label>
                                <select id="type" onchange="toggleFields(); updatePreview()">
                                    <option value="tours">Tour Package</option>
                                    <option value="blog">Journal Post</option>
                                    <option value="services">Service</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-col">
                                <label>Title (English)</label>
                                <input type="text" id="title_en" oninput="updatePreview()">
                            </div>
                            <div class="form-col">
                                <label>Title (Georgian)</label>
                                <input type="text" id="title_ka">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-col">
                                <label id="lbl_desc_en">Short Description (English)</label>
                                <textarea id="desc_en" oninput="updatePreview()"></textarea>
                            </div>
                            <div class="form-col">
                                <label id="lbl_desc_ka">Short Description (Georgian)</label>
                                <textarea id="desc_ka"></textarea>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-col">
                                <label>Main Image URL / Upload</label>
                                <input type="text" id="img" oninput="updatePreview()" placeholder="Paste Unsplash URL OR select file below">
                                <input type="file" id="file-upload" style="margin-top:5px;" onchange="handleFileUpload()">
                                <p id="upload-status"></p>
                            </div>
                            <div class="form-col">
                                <label>Tag / Badge (EN/KA)</label>
                                <div style="display:flex; gap:5px;">
                                    <input type="text" id="tag_en" class="col" placeholder="EN" oninput="updatePreview()">
                                    <input type="text" id="tag_ka" class="col" placeholder="KA">
                                </div>
                            </div>
                        </div>

                        <!-- DYNAMIC SUB-ITEMS (ITINERARY) -->
                        <div id="subitems-section" class="sub-items-container">
                            <label style="margin-bottom:10px; display:block; color:#333;">ITINERARY / DETAILS</label>
                            <div id="subitems-list"></div>
                            <button type="button" class="add-btn" onclick="addSubItem()">+ Add Row</button>
                        </div>

                        <!-- BLOG TEXT AREA (Only for Blog) -->
                        <div id="blog-section" style="display:none;">
                            <label>Full Article Text (English)</label>
                            <textarea id="text_en" style="height:150px; margin-bottom:10px;"></textarea>
                            <label>Full Article Text (Georgian)</label>
                            <textarea id="text_ka" style="height:150px;"></textarea>
                        </div>

                        <div class="action-bar">
                            <button class="btn-danger" onclick="deleteCurrent()">Delete Item</button>
                            <button class="btn-primary" onclick="saveCurrent()">SAVE CHANGES</button>
                        </div>

                    </div>
                </div>

                <!-- RIGHT: PREVIEW -->
                <div class="preview-panel">
                    <div class="preview-title">Live Card Preview</div>
                    <div id="live-preview-container" class="preview-card-wrapper">
                        <p style="text-align:center; color:#999;">Start typing in the editor to see the card preview.</p>
                    </div>
                </div>
            </div>
    </div>

    <div id="toast" class="status-toast">Saved Successfully</div>

                    { title: {en: "Mtirala", ka: "მტირალა"}, desc: {en: "Park", ka: "პარკი"}, img: "https://images.unsplash.com/photo-1597166567079-189725761f37?auto=format&fit=crop&w=800&q=80", tag: {en: "Active", ka: "აქტიური"}, subItems: [{title: "Hike", desc: "Forest"}] }
                ], 
                blog: [
                    { title: {en: "Sea & Sun", ka: "ზღვა და მზე"}, date: {en: "Summer", ka: "ზაფხული"}, img: "https://images.unsplash.com/photo-1565008447742-97f6f38c985c?auto=format&fit=crop&w=800&q=80" },
                    { title: {en: "Adjarian Khachapuri", ka: "აჭარული"}, date: {en: "Food", ka: "კვება"}, img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=800&q=80" },
                    { title: {en: "Batumi Nightlife", ka: "ბათუმის ღამე"}, date: {en: "Fun", ka: "გართობა"}, img: "https://images.unsplash.com/photo-1596306499317-849aa5dd3396?auto=format&fit=crop&w=800&q=80" },
                    { title: {en: "Nature Escape", ka: "ბუნებაში გაქცევა"}, date: {en: "Green", ka: "მწვანე"}, img: "https://images.unsplash.com/photo-1590418606746-018840f9cd0f?auto=format&fit=crop&w=800&q=80" }
                ] 
            },
            abkhazeti: { 
                accent: "#00695C", 
                tours: [
                    { title: {en: "Ritsa", ka: "რიწა"}, desc: {en: "Lake", ka: "ტბა"}, img: "https://images.unsplash.com/photo-1565008576549-57569a49371d?auto=format&fit=crop&w=800&q=80", tag: {en: "Nature", ka: "ბუნება"}, subItems: [{title: "View", desc: "Lake"}] },
                    { title: {en: "New Athos", ka: "ახალი ათონი"}, desc: {en: "Monastery", ka: "მონასტერი"}, img: "https://images.unsplash.com/photo-1565118531796-763e082d113?auto=format&fit=crop&w=800&q=80", tag: {en: "History", ka: "ისტორია"}, subItems: [{title: "Cave", desc: "Visit"}] },
                    { title: {en: "Gagra", ka: "გაგრა"}, desc: {en: "Resort", ka: "კურორტი"}, img: "https://images.unsplash.com/photo-1565008447742-97f6f38c985c?auto=format&fit=crop&w=800&q=80", tag: {en: "Relax", ka: "დასვენება"}, subItems: [{title: "Park", desc: "Walk"}] },
                    { title: {en: "Pitsunda", ka: "ბიჭვინთა"}, desc: {en: "Pine", ka: "ფიჭვი"}, img: "https://images.unsplash.com/photo-1590418606746-018840f9cd0f?auto=format&fit=crop&w=800&q=80", tag: {en: "Nature", ka: "ბუნება"}, subItems: [{title: "Cape", desc: "Forest"}] }
                ], 
                blog: [
                    { title: {en: "Hidden Gem", ka: "ფარული მარგალიტი"}, date: {en: "Discover", ka: "აღმოჩენა"}, img: "https://images.unsplash.com/photo-1565008576549-57569a49371d?auto=format&fit=crop&w=800&q=80" },
                    { title: {en: "Sacred Sites", ka: "წმინდა ადგილები"}, date: {en: "History", ka: "ისტორია"}, img: "https://images.unsplash.com/photo-1565118531796-763e082d113?auto=format&fit=crop&w=800&q=80" },
                    { title: {en: "Black Sea", ka: "შავი ზღვა"}, date: {en: "Water", ka: "წყალი"}, img: "https://images.unsplash.com/photo-1565008447742-97f6f38c985c?auto=format&fit=crop&w=800&q=80" },
                    { title: {en: "Alpine Views", ka: "ალპური ხედები"}, date: {en: "Mountain", ka: "მთა"}, img: "https://images.unsplash.com/photo-1536599018102-9f80336b083a?auto=format&fit=crop&w=800&q=80" }
                ] 
            }
        };

        const hardcodedServices = [
            { region: 'georgia', type: 'services', title: { en: "Travel Planning & Assistance", ka: "ტურების დაგეგმვა" }, desc: { en: "From wine and gastronomy tours to leisure and extreme adventure.", ka: "ჩვენ ვქმნით ავთენტურ გამოცდილებას." }, img: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=800&q=80", published: true },
            { region: 'georgia', type: 'services', title: { en: "Transport & Security", ka: "ტრანსპორტი და დაცვა" }, desc: { en: "Move with confidence. We provide a complete fleet along with professional security.", ka: "იმოგზაურეთ თავდაჯერებულად." }, img: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=800&q=80", published: true },
            { region: 'georgia', type: 'services', title: { en: "MICE & Business", ka: "MICE და ბიზნესი" }, desc: { en: "Business without borders. We act as your local logistical backbone, organizing conferences.", ka: "ბიზნესი საზღვრების გარეშე." }, img: "https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=800&q=80", published: true },
            { region: 'georgia', type: 'services', title: { en: "Medical & Wellness", ka: "სამედიცინო და ველნესი" }, desc: { en: "Your health, prioritized. We organize appointments, translation, and support for medical procedures.", ka: "ჯანმრთელობა პრიორიტეტულია." }, img: "https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=800&q=80", published: true },
        ];


        // --- GLOBAL VARS ---
        let loadedItems = {};
        let currentId = null;

        // --- AUTH ---
        window.handleLogin = () => {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Login Error: " + err.message));
        };
        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if(user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-header').style.display = 'flex';
                document.querySelector('.admin-body').style.display = 'flex';
                loadStructuredData();
                updatePreview(); 
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('main-header').style.display = 'none';
                document.querySelector('.admin-body').style.display = 'none';
            }
        });

        // --- DATA LOADING & STRUCTURED LIST (FIXED CLICK) ---
        window.loadStructuredData = async () => {
            const list = document.getElementById('items-list');
            list.innerHTML = '';
            loadedItems = {};
            
            try {
                const q = query(collection(db, "content"));
                const snap = await getDocs(q);
                
                let contentByRegion = {};
                snap.forEach(doc => {
                    const item = doc.data();
                    item.id = doc.id;
                    loadedItems[item.id] = item;
                    
                    if (!contentByRegion[item.region]) {
                        contentByRegion[item.region] = {};
                    }
                    if (!contentByRegion[item.region][item.type]) {
                         contentByRegion[item.region][item.type] = [];
                    }
                    contentByRegion[item.region][item.type].push(item);
                });

                const regionDisplayOrder = ['georgia', 'tbilisi', 'mtskheta_mtianeti', 'kartli', 'kakheti', 'samtskhe_javakheti', 'imereti', 'samegrelo', 'guria', 'racha', 'svaneti', 'adjara', 'abkhazeti'];
                const typeNames = { tours: "Tours", services: "Services", blog: "Journal" };
                const regionNames = {
                    georgia: "HOME / SERVICES", tbilisi: "TBILISI", mtskheta_mtianeti: "MTSKHETA-MTIANETI", kartli: "KARTLI", kakheti: "KAKHETI", samtskhe_javakheti: "SAMTSKHE-JAVAKHETI", imereti: "IMERETI", samegrelo: "SAMEGRELO", guria: "GURIA", racha: "RACHA-LECHKHUMI", svaneti: "SVANETI", adjara: "ADJARA", abkhazeti: "ABKHAZETI"
                };

                // Render Structured List
                list.innerHTML = `<div style="padding: 0 10px;"><button class="btn-new" onclick="createNew()" style="width:100%; margin-bottom:10px;">+ CREATE NEW ITEM</button></div>`;
                
                regionDisplayOrder.forEach(regionKey => {
                    const regionContent = contentByRegion[regionKey];
                    let totalItemsInRegion = 0;
                    if (regionContent) {
                        Object.keys(regionContent).forEach(typeKey => totalItemsInRegion += regionContent[typeKey].length);
                    }

                    if (totalItemsInRegion > 0) {
                        const groupDiv = document.createElement('div');
                        groupDiv.className = 'region-group';
                        groupDiv.innerHTML = `<div class="region-title" onclick="toggleRegionList(this)">
                            ${regionNames[regionKey] || regionKey.toUpperCase()} [${totalItemsInRegion}] <span class="toggle-arrow">▶</span>
                        </div>`;

                        const subList = document.createElement('ul');
                        subList.className = 'sub-list';
                        subList.style.display = 'none';
                        
                        for (const typeKey in typeNames) {
                            const items = regionContent ? regionContent[typeKey] || [] : [];
                            if (items.length > 0) {
                                subList.innerHTML += `<li class="sub-list-item" style="color:${typeKey === 'tours' ? 'var(--terracotta)' : typeKey === 'blog' ? 'var(--blue)' : 'var(--green)'};">
                                    ${typeNames[typeKey]} [${items.length}]
                                </li>`;
                                items.forEach(item => {
                                    const listItem = document.createElement('div');
                                    listItem.className = `list-item ${item.id === currentId ? 'active' : ''}`;
                                    listItem.innerHTML = `
                                        <span class="item-status ${item.published ? 'status-published' : 'status-hidden'}">${item.published ? 'LIVE' : 'HIDDEN'}</span>
                                        <span class="item-title">${item.title?.en || 'Untitled'}</span>
                                    `;
                                    listItem.onclick = () => selectItem(item.id); 
                                    subList.appendChild(listItem);
                                });
                            }
                        }
                        
                        groupDiv.appendChild(subList);
                        list.appendChild(groupDiv);
                    }
                });

                if(snap.empty) {
                    list.innerHTML += '<p style="padding:20px; text-align:center; color:#999;">No content found. Click NEW or IMPORT.</p>';
                }

            } catch (e) {
                list.innerHTML = `<p style="color:red; padding:20px;">Error loading: ${e.message}</p>`;
            }
        };
        
        window.toggleRegionList = (element) => {
            const group = element.closest('.region-group');
            const list = group.querySelector('.sub-list');
            const arrow = group.querySelector('.toggle-arrow');
            
            if (list.style.display === 'none' || list.style.display === '') {
                list.style.display = 'block';
                arrow.style.transform = 'rotate(90deg)';
            } else {
                list.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            }
        };

        // --- IMAGE UPLOAD LOGIC ---
        window.handleFileUpload = async () => {
            const fileInput = document.getElementById('file-upload');
            const file = fileInput.files[0];
            const status = document.getElementById('upload-status');
            
            if (!file) return;

            status.innerHTML = 'Uploading... (0%)';

            try {
                const fileName = `${Date.now()}-${file.name}`;
                const storageRef = ref(storage, 'images/' + fileName);
                const uploadTask = uploadBytes(storageRef, file);

                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        status.innerHTML = `Uploading... (${Math.round(progress)}%)`;
                    }, 
                    (error) => {
                        status.innerHTML = `❌ Upload failed: ${error.message}`;
                    }, 
                    () => {
                        getDownloadURL(uploadTask.snapshot.ref).then((downloadURL) => {
                            document.getElementById('img').value = downloadURL;
                            status.innerHTML = '✅ Upload complete! URL inserted.';
                            updatePreview();
                        });
                    }
                );

            } catch (e) {
                status.innerHTML = `❌ Critical Upload Error: ${e.message}`;
            }
        };

        // --- IMPORT DATA ---
        window.importHardcodedData = async () => {
            if(!auth.currentUser) return alert("Please log in first.");
            if(!confirm("WARNING: This will upload ALL pre-designed tours, services, and blogs to Firebase. Do this only once! Continue?")) return;
            
            const allItems = [];

            const processRegion = (regionKey, data, type) => {
                if (!data) return;
                data.forEach(item => {
                    const newItem = {
                        region: regionKey,
                        type: type,
                        published: true,
                        title: item.title,
                        img: item.img,
                        tag: item.tag || {en:'', ka:''},
                        subItems: item.subItems || [],
                        desc: item.desc || item.date || '',
                        date: item.date || item.desc || '',
                        text: item.text || {en:'', ka:''}
                    };
                    allItems.push(newItem);
                });
            };
            
            for (const regionKey in hardcodedDatabase) {
                const regionData = hardcodedDatabase[regionKey];
                processRegion(regionKey, regionData.tours, 'tours');
                processRegion(regionKey, regionData.blog, 'blog');
            }
            
            hardcodedServices.forEach(service => {
                 allItems.push({...service, type: 'services', region: 'georgia', published: true, tag: {en: 'Service', ka: 'სერვისი'}});
            });


            let successCount = 0;
            for (const item of allItems) {
                try {
                    await addDoc(collection(db, "content"), item);
                    successCount++;
                } catch (e) {
                    console.error("Upload error for item:", item, e);
                }
            }

            showToast(`✅ Successfully imported ${successCount} items!`);
            loadStructuredData(); 
        };


        // --- CORE EDITOR FUNCTIONS ---

        window.selectItem = (id) => {
            const data = loadedItems[id];
            if (!data) return;

            // 1. Remove active class from all items and add it to the clicked one
            document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
            // Use the data ID to find the element and activate it
            const clickedElement = document.querySelector(`.list-item[onclick*="'${data.id}'"]`);
            if (clickedElement) {
                clickedElement.classList.add('active');
            }
            
            // 2. Load data into the form fields
            currentId = data.id;
            document.getElementById('docId').value = data.id;
            document.getElementById('published').checked = data.published !== false;
            
            document.getElementById('region').value = data.region;
            document.getElementById('type').value = data.type;
            
            document.getElementById('title_en').value = data.title?.en || '';
            document.getElementById('title_ka').value = data.title?.ka || '';
            
            document.getElementById('desc_en').value = data.desc?.en || data.date?.en || '';
            document.getElementById('desc_ka').value = data.desc?.ka || data.date?.ka || '';
            
            document.getElementById('img').value = data.img || '';
            document.getElementById('tag_en').value = data.tag?.en || '';
            document.getElementById('tag_ka').value = data.tag?.ka || '';
            
            document.getElementById('text_en').value = data.text?.en || '';
            document.getElementById('text_ka').value = data.text?.ka || '';

            // 3. Sub Items
            const container = document.getElementById('subitems-list');
            container.innerHTML = '';
            if(data.subItems && Array.isArray(data.subItems)) {
                data.subItems.forEach(sub => addSubItem(sub.title, sub.desc));
            }
            
            toggleFields();
            updatePreview(); 
            window.scrollTo(0, 0); 
        };

        window.createNew = () => {
            currentId = null;
            document.getElementById('docId').value = "";
            document.querySelectorAll('input, textarea').forEach(el => el.value = '');
            document.getElementById('subitems-list').innerHTML = '';
            document.getElementById('published').checked = true;
            toggleFields();
            updatePreview(); 
            document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
        };

        window.toggleFields = () => {
            const type = document.getElementById('type').value;
            const subSec = document.getElementById('subitems-section');
            const blogSec = document.getElementById('blog-section');
            const lblEn = document.getElementById('lbl_desc_en');
            const lblKa = document.getElementById('lbl_desc_ka');

            if(type === 'blog') {
                subSec.style.display = 'none';
                blogSec.style.display = 'block';
                lblEn.innerText = "Date (English)";
                lblKa.innerText = "Date (Georgian)";
            } else {
                subSec.style.display = 'block';
                blogSec.style.display = 'none';
                lblEn.innerText = "Short Description (English)";
                lblKa.innerText = "Short Description (Georgian)";
            }
        };

        window.addSubItem = (t = '', d = '') => {
            const div = document.createElement('div');
            div.className = 'sub-item-row';
            div.innerHTML = `
                <div style="flex:1">
                    <input type="text" placeholder="Title (e.g., Day 1)" class="sub-title" value="${t}" style="margin-bottom:5px">
                    <textarea placeholder="Details..." class="sub-desc" style="height:60px">${d}</textarea>
                </div>
                <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('subitems-list').appendChild(div);
        };

        // --- LIVE PREVIEW LOGIC (Continued) ---
        window.updatePreview = () => {
            const container = document.getElementById('live-preview-container');
            const type = document.getElementById('type').value;
            const title = document.getElementById('title_en').value || 'Tour Title';
            const desc = document.getElementById('desc_en').value || 'Description goes here...';
            const img = document.getElementById('img').value || 'https://via.placeholder.com/300x400?text=Image';
            const tag = document.getElementById('tag_en').value;
            
            const finalImg = (img && img.startsWith('http')) ? img : 'https://via.placeholder.com/300x400?text=IMAGE';
            let html = '';

            if (type === 'blog') {
                html = `
                    <div class="blog-card">
                        <div class="blog-img-box"><img src="${finalImg}" onerror="this.src='https://via.placeholder.com/300x200?text=Blog'"></div>
                        <div class="blog-content">
                            <div class="blog-date">${desc}</div>
                            <h4 class="blog-title">${title}</h4>
                            <span class="blog-link">Read Article &rarr;</span>
                        </div>
                    </div>
                `;
            } else {
                const tagHtml = tag ? `<span class="card-tag" style="background:var(--terracotta);">${tag}</span>` : '';
                html = `
                    <div class="card">
                        <img src="${finalImg}" class="card-bg" onerror="this.src='https://via.placeholder.com/300x400?text=Tour'">
                        ${tagHtml}
                        <div class="card-overlay">
                            <h3>${title}</h3>
                            <p>${desc}</p>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        };


        // --- SAVE/UPDATE LOGIC ---
        window.saveCurrent = async () => {
            if (!auth.currentUser) return alert("Please log in first.");
            
            const type = document.getElementById('type').value;
            const id = document.getElementById('docId').value;
            const status = document.getElementById('toast');
            
            let subItems = [];
            document.querySelectorAll('.sub-item-row').forEach(row => {
                subItems.push({
                    title: row.querySelector('.sub-title').value,
                    desc: row.querySelector('.sub-desc').value
                });
            });

            const data = {
                region: document.getElementById('region').value,
                type: type,
                published: document.getElementById('published').checked,
                title: { en: document.getElementById('title_en').value, ka: document.getElementById('title_ka').value },
                img: document.getElementById('img').value,
                tag: { en: document.getElementById('tag_en').value, ka: document.getElementById('tag_ka').value }
            };

            if(type === 'blog') {
                data.date = { en: document.getElementById('desc_en').value, ka: document.getElementById('desc_ka').value };
                data.text = { en: document.getElementById('text_en').value, ka: document.getElementById('text_ka').value };
                delete data.subItems; delete data.desc;
            } else {
                data.desc = { en: document.getElementById('desc_en').value, ka: document.getElementById('desc_ka').value };
                data.subItems = subItems;
                delete data.date; delete data.text;
            }

            try {
                if(id) {
                    await updateDoc(doc(db, "content", id), data);
                } else {
                    await addDoc(collection(db, "content"), data);
                }
                showToast(id ? "Updated Successfully!" : "Created Successfully!");
                createNew();
                loadStructuredData(); 
            } catch(e) { alert(e.message); }
        };

        window.deleteCurrent = async () => {
            if(!currentId) return;
            if(confirm("Are you sure you want to delete this?")) {
                await deleteDoc(doc(db, "content", currentId));
                showToast("Deleted.");
                createNew();
                loadStructuredData();
            }
        };
        
    </script>
</body>
</html>
